<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanavu Illam - Welcome Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0F1319;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .screen-container {
      width: 390px;
      height: 844px;
      position: relative;
      background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 32px 32px 32px;
      overflow: hidden;
    }
    .serif-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
    }
    .logo-img {
      width: 220px;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 16px 28px rgba(27, 33, 47, 0.12));
    }
    .btn-get-started {
      background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);
      box-shadow: 0 8px 24px rgba(229, 138, 24, 0.35);
      transition: all 0.15s ease-out;
    }
    .btn-get-started:active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #E58A18 0%, #B46205 100%);
      box-shadow: 0 4px 14px rgba(180, 98, 5, 0.4);
    }
  </style>
</head>
<body style="background: linear-gradient(rgb(233, 238, 244) 0%, rgb(216, 223, 233) 100%); margin: 0px; padding: 0px; min-height: 100vh; display: flex; justify-content: center; align-items: center;">

  <div class="screen-container" style="width: 390px; height: 844px; max-height: 844px; overflow: hidden; background: linear-gradient(rgb(233, 238, 244) 0%, rgb(216, 223, 233) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 0px 32px 32px; box-sizing: border-box;">
    
    <!-- UPPER SECTION (fills the remaining height, content centered vertically) -->
    <div class="flex-1 flex flex-col items-center justify-center pt-8">
      <!-- Centered Logo -->
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjoyTHEAQXNPBE0yjkg3CCUGO-twg51-i2YmOcjAZEToR1cGc5ATJnyYoBXZoYsiQ0kAmsyZ-fQhpLpTJTodNo2b9LNvhGVDG2y6nemdmu5DXWWvtDo89O1bzlab5l-X7y4Yv0sb6UG5lBD3vAAzkKYdEgG-2n4OYA4_MsIy_75zLk3eMJl27zHQRznSdMiBRKmQvw8tUZsiLqkhxrjdPT5-SjZJlRSNPmtoY1VBchrP-l917gEVWikKHtrbY1xqfT6A" alt="Kanavu Illam Logo" class="logo-img" style="background: transparent; border-width: medium; border-style: none; border-color: currentcolor; border-image: none; filter: none; width: 240px; max-width: 240px; height: auto; object-fit: contain;">

      <!-- Tagline 24px below logo -->
      <div class="mt-6 text-center leading-[1.25]" style="margin-top: 24px;">
        <p class="serif-tagline text-[29px] text-[#364050] font-semibold tracking-normal">
          Kanavu vidhaitha nilaththil
        </p>
        <p class="serif-tagline text-[29px] text-[#B46205] font-bold tracking-normal">
          Illam ezhum
        </p>
      </div>
    </div>

    <!-- LOWER SECTION (left-aligned, 32px from bottom edge) -->
    <div class="w-full text-left">
      <!-- Title -->
      <h1 class="text-[26px] font-[800] text-[#18191D] tracking-[-0.6px] leading-tight">
        Welcome to Kanavu Illam
      </h1>

      <!-- Subtitle (8px below title) -->
      <p class="text-[15px] font-[400] text-[#64748B] mt-2 leading-relaxed">
        Your dream home journey starts here
      </p>

      <!-- Get Started Button (24px below subtitle) -->
      <a href="#" onclick="if(window.parent) window.parent.postMessage({type:'NAVIGATE_TO', target:'{{DATA:SCREEN:SCREEN_4}}'}, '*'); return false;" class="btn-get-started mt-6 w-full h-[56px] rounded-full flex items-center justify-center gap-2 cursor-pointer no-underline block">
        <span class="text-[#1E252D] font-bold text-[16px] tracking-wide">
          Get Started
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E252D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

  </div>







</body></html>
