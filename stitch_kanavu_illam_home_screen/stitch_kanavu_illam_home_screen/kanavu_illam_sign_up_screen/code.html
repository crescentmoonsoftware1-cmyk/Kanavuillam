<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, user-scalable=no">
  <title>Kanavu Illam - Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);
      width: 390px;
      height: 844px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .amber-btn {
      background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);
      box-shadow: 0 8px 24px rgba(229, 138, 24, 0.35);
    }
    .input-field:focus-within {
      border-color: #E58A18 !important;
      border-width: 1.5px !important;
    }
    /* Custom Checkbox */
    .custom-check {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 1.5px solid #94A3B8;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      background-color: transparent;
      position: relative;
    }
    .custom-check:checked {
      background-color: #E58A18;
      border-color: #E58A18;
    }
    .custom-check:checked::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 9px;
      border: solid #1E252D;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      top: 3px;
      left: 6px;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between px-5 pt-10 box-border pb-8">

  <!-- Status Bar placeholder -->
  <div class="w-full flex justify-between items-center px-3 mb-1 text-xs font-semibold text-[#18191D] tracking-tight">
    <span class="">9:41</span>
    <div class="flex items-center space-x-1.5">
      <svg class="w-4 h-3.5" viewBox="0 0 16 12" fill="currentColor">
        <path d="M1 9h2V3H1v6zm4 2h2V1H5v10zm4-4h2V5H9v4zm4-6v10h2V1h-2z"></path>
      </svg>
      <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 3.5a7.5 7.5 0 00-5.3 2.2L1.3 4.3A9.5 9.5 0 018 1.5c2.6 0 5 1 6.7 2.8l-1.4 1.4A7.5 7.5 0 008 3.5zm0 4a4.5 4.5 0 00-3.2 1.3L3.4 7.4A6.5 6.5 0 018 5.5c1.8 0 3.4.7 4.6 1.9l-1.4 1.4A4.5 4.5 0 008 7.5zm0 4a1.5 1.5 0 00-1.1.5L8 13.5l1.1-1.5A1.5 1.5 0 008 11.5z"></path>
      </svg>
      <div class="w-5 h-2.5 border border-[#18191D] rounded-sm p-0.5 flex items-center">
        <div class="w-full h-full bg-[#18191D] rounded-2xs"></div>
      </div>
    </div>
  </div>

  <!-- Header Section: Logo + Kanavu Illam -->
  <div class="flex justify-center items-center mb-6"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGXs_YllPLYQesvvLroOQEGYdW6ZkkptWoUGXZ2GRAd3msCFbRsXHdqCk5FGj1qU4_fzae7SMXP_k8D5LIBXpc20R48CEonGDvpjxP2reHlSkUeo5VIb160UKVqq9n1h2XNIYkJGdvg95ph_TI2w9S_cYRwbduGQG1MO1Yjn1MY96plrdqCZ_nltxOq1ICAQ24djEPx6bKb8c75nO-Xui5t3C5-k7j25i9kTtceOIJYFND9LGD7bSeBvrLZRWHLjj7_w" alt="Kanavu Illam" class="h-[112px] w-auto object-contain"></div>

  <!-- Main White Card -->
  <div class="w-full bg-[#FCFDFF] border border-[#E9EAEC] rounded-[32px] p-5 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex flex-col box-border">
    <!-- Title -->
    <h2 class="text-[26px] font-bold text-[#18191D] tracking-tight mb-4">Create account</h2>

    <!-- Inputs Container -->
    <div class="flex flex-col space-y-3">
      <!-- Input 1: Full Name -->
      <div class="input-field flex items-center h-[52px] px-4 bg-[#F4F7FB] border border-[#E2E8F0] rounded-[20px] transition-all">
        <svg class="w-5 h-5 text-[#8E94A0] flex-shrink-0 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input type="text" placeholder="Full Name" class="w-full bg-transparent text-[#18191D] placeholder-[#8E94A0] text-[14px] font-medium focus:outline-none">
      </div>

      <!-- Input 2: Email address -->
      <div class="input-field flex items-center h-[52px] px-4 bg-[#F4F7FB] border border-[#E2E8F0] rounded-[20px] transition-all">
        <svg class="w-5 h-5 text-[#8E94A0] flex-shrink-0 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <input type="email" placeholder="Email address" class="w-full bg-transparent text-[#18191D] placeholder-[#8E94A0] text-[14px] font-medium focus:outline-none">
      </div>

      <!-- Input 3: Password -->
      <div class="input-field flex items-center h-[52px] px-4 bg-[#F4F7FB] border border-[#E2E8F0] rounded-[20px] transition-all">
        <svg class="w-5 h-5 text-[#8E94A0] flex-shrink-0 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <input id="signupPasswordInput" type="password" placeholder="Password" class="w-full bg-transparent text-[#18191D] placeholder-[#8E94A0] text-[14px] font-medium focus:outline-none">
        <button type="button" onclick="toggleSignupPassword()" class="text-[#8E94A0] hover:text-[#18191D] focus:outline-none ml-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Checkbox Row: Terms -->
    <div class="flex items-center space-x-2.5 my-3.5 pl-0.5">
      <input type="checkbox" id="terms" class="custom-check" checked="">
      <label for="terms" class="text-[14px] text-[#364050] select-none cursor-pointer">
        I agree to <a href="#" class="text-[#18191D] font-bold underline decoration-1 underline-offset-2">Terms</a>
      </label>
    </div>

    <!-- Register Button -->
    <button type="button" class="amber-btn w-full h-[52px] rounded-full flex items-center justify-center space-x-2 transition-transform active:scale-[0.98]">
      <span class="text-[15px] font-bold text-[#1E252D]">Register</span>
      <svg class="w-5 h-5 text-[#1E252D]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </button>

    <!-- Divider: "or" -->
    <div class="flex items-center my-3.5">
      <div class="flex-grow h-px bg-[#E2E8F0]"></div>
      <span class="px-3 text-[13px] text-[#8E94A0] font-medium">or</span>
      <div class="flex-grow h-px bg-[#E2E8F0]"></div>
    </div>

    <!-- Continue with Google Button -->
    <button type="button" class="w-full h-[52px] rounded-full bg-[#FCFDFF] border border-[#E2E8F0] flex items-center justify-center space-x-2.5 transition-colors hover:bg-[#F4F7FB] active:scale-[0.98]">
      <!-- Official Google 'G' Logo -->
      <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
      </svg>
      <span class="text-[14px] font-bold text-[#18191D]">Continue with Google</span>
    </button>
  </div>

  <!-- Bottom Link: Sign in -->
  <div class="flex items-center justify-center space-x-1.5">
    <span class="text-[14px] text-[#8E94A0]">Already have an account?</span>
    <a href="#" class="text-[14px] font-bold text-[#18191D] underline decoration-1 underline-offset-2">Sign in</a>
  </div>

  <script>
    function toggleSignupPassword() {
      const input = document.getElementById('signupPasswordInput');
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>




</body></html>
