<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanavu Illam History Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbars for clean native mobile UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="m-0 p-0 flex justify-center items-center min-h-screen bg-slate-200 antialiased selection:bg-[#FDEBCB]">
  <!-- Mobile Container: iPhone 390x844 fixed layout -->
  <div class="relative w-[390px] h-[844px] overflow-hidden flex flex-col justify-between" style="background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);">
    
    <!-- Top Content Area (Header, Filters, Scrollable List) -->
    <div class="flex-1 flex flex-col overflow-hidden pt-4">
      
      <!-- 1. TOP DARK HEADER (16px side margin, ~150px tall, 32px radius) -->
      <div class="mx-4 h-[140px] rounded-[32px] px-6 flex items-center relative shadow-[0_16px_40px_rgba(27,33,47,0.22)] shrink-0" style="background: linear-gradient(rgb(54, 64, 80) 0%, rgb(27, 33, 47) 100%);"><h1 class="text-[32px] font-bold text-white leading-tight tracking-[-0.02em]">History</h1></div>

      <!-- 2. FILTER CHIPS (Horizontal row below header) -->
      

      <!-- 3. HISTORY LIST (Vertically scrollable, 4 cards) -->
      <div class="flex-1 overflow-y-auto no-scrollbar px-5 pt-4 pb-28 flex flex-col gap-3"><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="11" x2="15" y2="11"></line><line x1="11" y1="3" x2="11" y2="11"></line><line x1="15" y1="7" x2="15" y2="21"></line><line x1="9" y1="11" x2="9" y2="21"></line></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 01</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">12 Oct 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹499</div></div><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="14" x2="21" y2="14"></line><line x1="13" y1="3" x2="13" y2="21"></line><circle cx="8" cy="8.5" r="2"></circle></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 02</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">28 Sep 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹799</div></div><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="9" y1="10" x2="21" y2="10"></line><line x1="15" y1="10" x2="15" y2="21"></line></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 03</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">15 Sep 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹499</div></div><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="18" y2="9"></line><line x1="10" y1="9" x2="10" y2="21"></line><line x1="18" y1="3" x2="18" y2="16"></line><line x1="10" y1="16" x2="21" y2="16"></line></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 04</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">02 Aug 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹1,299</div></div><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 05</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">19 Jul 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹499</div></div><div class="bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.10)] flex items-center justify-between"><div class="w-12 h-12 rounded-full bg-[#2E3744] flex items-center justify-center shrink-0"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="7" y1="3" x2="7" y2="21"></line><line x1="7" y1="15" x2="21" y2="15"></line><line x1="16" y1="3" x2="16" y2="15"></line></svg></div><div class="flex-1 ml-3.5 min-w-0"><h2 class="text-base font-bold text-[#18191D] truncate">Floor Plan 06</h2><p class="text-xs text-[#8E94A0] font-normal mt-0.5">04 Jun 2026</p></div><div class="text-base font-bold text-[#18191D] text-right shrink-0">₹899</div></div></div>
    </div>

    <!-- 4. FLOATING BOTTOM NAV (32px radius pill with margin, elevated) -->
    <div class="absolute bottom-5 inset-x-4 z-20 pointer-events-auto">
      <nav class="h-[68px] rounded-[32px] bg-[#FCFDFF] shadow-[0_12px_32px_rgba(27,33,47,0.12)] px-6 flex items-center justify-between border border-[#E9EAEC]/60">
        
        <!-- Tab 1: Home (Unselected) -->
        <button class="flex flex-col items-center justify-center gap-1 group py-1" aria-label="Home">
          <svg class="w-6 h-6 text-[#8E94A0] group-hover:text-[#364050] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"></path>
          </svg>
          <span class="text-[11px] font-medium text-[#8E94A0] group-hover:text-[#364050] transition-colors">Home</span>
        </button>

        <!-- Tab 2: History (Selected: amber gradient circle + dark charcoal icon) -->
        <button class="flex flex-col items-center justify-center gap-1 -mt-0.5" aria-label="History">
          <div class="w-10 h-10 rounded-full flex items-center justify-center shadow-[0_4px_14px_rgba(229,138,24,0.30)]" style="background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);">
            <svg class="w-5 h-5 text-[#1E252D]" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <span class="text-[11px] font-bold text-[#18191D]">History</span>
        </button>

        <!-- Tab 3: Profile (Unselected) -->
        <button class="flex flex-col items-center justify-center gap-1 group py-1" aria-label="Profile">
          <svg class="w-6 h-6 text-[#8E94A0] group-hover:text-[#364050] transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
          </svg>
          <span class="text-[11px] font-medium text-[#8E94A0] group-hover:text-[#364050] transition-colors">Profile</span>
        </button>

      </nav>
    </div>

  </div>




</body></html>
