<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanavu Illam - 3D Villa Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-0 m-0">
  <!-- iPhone 390x844 Frame -->
  <div class="w-[390px] h-[844px] max-h-[844px] overflow-hidden relative flex flex-col justify-between" style="background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);">
    
    <!-- Status Bar -->
    <div class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold text-[#18191D] shrink-0 z-20">
      <span>9:41</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-4 h-3 text-[#18191D]" fill="currentColor" viewBox="0 0 16 12"><path d="M1 9h2a1 1 0 001-1V4a1 1 0 00-1-1H1a1 1 0 00-1 1v4a1 1 0 001 1zm4 1h2a1 1 0 001-1V3a1 1 0 00-1-1H5a1 1 0 00-1 1v6a1 1 0 001 1zm4 1h2a1 1 0 001-1V2a1 1 0 00-1-1H9a1 1 0 00-1 1v8a1 1 0 001 1zm4 1h2a1 1 0 001-1V1a1 1 0 00-1-1h-2a1 1 0 00-1 1v10a1 1 0 001 1z"/></svg>
        <svg class="w-3.5 h-3 text-[#18191D]" fill="currentColor" viewBox="0 0 16 12"><path d="M8 2.5a10.9 10.9 0 00-6.3 2A1 1 0 001.4 5.9l5.9 7.4a1 1 0 001.5 0l5.8-7.4a1 1 0 00-.3-1.4A10.9 10.9 0 008 2.5z"/></svg>
        <div class="w-5 h-2.5 border border-[#18191D] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3 bg-[#18191D] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Top Bar -->
    <div class="w-full px-5 py-2 flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-3">
        <!-- 44px Back Button -->
        <button class="w-11 h-11 rounded-full bg-[#FCFDFF] border border-[#E9EAEC] flex items-center justify-center shadow-sm text-[#18191D] active:scale-95 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div>
          <h1 class="text-lg font-bold text-[#18191D] leading-tight">3D Villa Model</h1>
          <p class="text-xs text-[#8E94A0] leading-tight">Interactive 3D Architecture</p>
        </div>
      </div>
      <!-- Pill Chip 8 Rooms -->
      <span class="px-3 py-1 rounded-full bg-[#E9EEF4] text-[#364050] text-xs font-semibold">
        8 Rooms
      </span>
    </div>

    <!-- Main Content: Large 3D Viewer Card (~480px) -->
    <div class="px-5 flex-1 flex flex-col justify-center">
      <div class="w-full h-[480px] bg-[#FCFDFF] rounded-[28px] border border-[#E9EAEC] shadow-[0_12px_32px_rgba(27,33,47,0.10)] relative overflow-hidden flex flex-col items-center justify-between p-4">
        
        <!-- Viewer Header Controls (Compass / Layer Pill) -->
        <div class="w-full flex justify-between items-center z-10">
          <div class="w-8 h-8 rounded-full bg-[#E9EEF4] flex items-center justify-center text-[#364050] text-xs font-bold shadow-xs">
            N
          </div>
          <div class="flex space-x-1.5">
            <span class="px-2.5 py-1 rounded-full bg-[#E9EEF4] text-[#364050] text-[11px] font-semibold">Ground + 1F</span>
          </div>
        </div>

        <!-- Isometric 3D Model Illustration (Cool Slate & White Tones) -->
        <div class="relative w-full h-[360px] flex items-center justify-center">
          <svg class="w-full h-full" viewBox="0 0 340 320" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Ground Slab / Shadow -->
            <polygon points="170,290 320,205 170,120 20,205" fill="#E2E8F0" opacity="0.6" />
            <polygon points="170,300 320,215 170,130 20,215" fill="#D8DFE9" opacity="0.4" />
            
            <!-- Ground Floor Walls -->
            <!-- Left Face -->
            <polygon points="70,185 170,240 170,185 70,130" fill="#2E3744" />
            <!-- Right Face -->
            <polygon points="170,240 270,185 270,130 170,185" fill="#364050" />
            <!-- Top Ground Slab -->
            <polygon points="70,130 170,185 270,130 170,75" fill="#FCFDFF" stroke="#E2E8F0" stroke-width="1.5" />

            <!-- First Floor Massing -->
            <!-- Left Face -->
            <polygon points="90,120 170,165 170,110 90,65" fill="#364050" />
            <!-- Right Face -->
            <polygon points="170,165 250,120 250,65 170,110" fill="#475569" />
            <!-- First Floor Roof Slab -->
            <polygon points="90,65 170,110 250,65 170,20" fill="#FCFDFF" stroke="#E2E8F0" stroke-width="2" />
            
            <!-- Parapet Wall & Pergola Details -->
            <polygon points="100,58 170,98 240,58 170,18" fill="#F8FAFC" />
            <!-- Architectural Columns & Lines -->
            <line x1="170" y1="185" x2="170" y2="240" stroke="#1B212F" stroke-width="2" />
            <line x1="70" y1="130" x2="70" y2="185" stroke="#1B212F" stroke-width="1.5" />
            <line x1="270" y1="130" x2="270" y2="185" stroke="#1B212F" stroke-width="1.5" />
            
            <!-- Architectural Glazing / Windows (Cool Slate Highlights) -->
            <polygon points="100,145 135,165 135,145 100,125" fill="#CBD5E1" stroke="#364050" stroke-width="1" />
            <polygon points="185,160 220,140 220,120 185,140" fill="#CBD5E1" stroke="#364050" stroke-width="1" />
            <polygon points="110,85 145,105 145,90 110,70" fill="#CBD5E1" stroke="#1E252D" stroke-width="1" />
            <polygon points="185,100 225,78 225,65 185,87" fill="#CBD5E1" stroke="#1E252D" stroke-width="1" />

            <!-- Dimension / Grid Indicators -->
            <line x1="20" y1="205" x2="170" y2="290" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="1" />
            <line x1="320" y1="205" x2="170" y2="290" stroke="#94A3B8" stroke-dasharray="4 4" stroke-width="1" />
          </svg>
        </div>

        <!-- Pill Label: Drag to rotate • Pinch to zoom -->
        <div class="px-4 py-1.5 rounded-full bg-[#1B212F]/70 backdrop-blur-sm text-white text-xs font-medium z-10 mb-1">
          Drag to rotate • Pinch to zoom
        </div>
      </div>
    </div>

    <!-- Bottom Floating Card -->
    <div class="px-5 pb-6 pt-3 shrink-0">
      <div class="bg-[#FCFDFF] rounded-[32px] p-4 shadow-[0_12px_32px_rgba(27,33,47,0.12)] border border-[#E9EAEC] flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <!-- Small Icon Circle -->
          <div class="w-10 h-10 rounded-full bg-[#E9EEF4] flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-[#364050]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
          </div>
          <div>
            <h4 class="text-sm font-bold text-[#18191D] leading-tight">Next: Vastu Analysis</h4>
            <p class="text-xs text-[#8E94A0] leading-tight">Room-by-room compliance</p>
          </div>
        </div>

        <!-- VIEW VASTU Pill Button -->
        <button class="px-4 py-2.5 rounded-full font-bold text-xs tracking-wide text-[#1E252D] shadow-[0_4px_16px_rgba(229,138,24,0.30)] active:scale-95 transition-transform shrink-0" style="background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);">
          VIEW VASTU
        </button>
      </div>

      <!-- iOS Home Indicator -->
      <div class="w-32 h-1 bg-[#18191D]/30 rounded-full mx-auto mt-4"></div>
    </div>

  </div>
</body>
</html>
