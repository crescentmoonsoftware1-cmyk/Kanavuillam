<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, user-scalable=no">
  <title>Kanavu Illam - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);
      width: 390px;
      height: 844px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .amber-btn {
      background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);
      box-shadow: 0 8px 24px rgba(229, 138, 24, 0.35);
    }
    .input-field:focus-within {
      border-color: #E58A18 !important;
      border-width: 1.5px !important;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between px-5 pt-12 pb-8 box-border">

  <!-- Status Bar placeholder for native iPhone feel -->
  <div class="w-full flex justify-between items-center px-3 mb-2 text-xs font-semibold text-[#18191D] tracking-tight">
    <span class="">9:41</span>
    <div class="flex items-center space-x-1.5">
      <svg class="w-4 h-3.5" viewBox="0 0 16 12" fill="currentColor">
        <path d="M1 9h2V3H1v6zm4 2h2V1H5v10zm4-4h2V5H9v4zm4-6v10h2V1h-2z"></path>
      </svg>
      <svg class="w-3.5 h-3.5" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 3.5a7.5 7.5 0 00-5.3 2.2L1.3 4.3A9.5 9.5 0 018 1.5c2.6 0 5 1 6.7 2.8l-1.4 1.4A7.5 7.5 0 008 3.5zm0 4a4.5 4.5 0 00-3.2 1.3L3.4 7.4A6.5 6.5 0 018 5.5c1.8 0 3.4.7 4.6 1.9l-1.4 1.4A4.5 4.5 0 008 7.5zm0 4a1.5 1.5 0 00-1.1.5L8 13.5l1.1-1.5A1.5 1.5 0 008 11.5z"></path>
      </svg>
      <div class="w-5 h-2.5 border border-[#18191D] rounded-sm p-0.5 flex items-center">
        <div class="w-full h-full bg-[#18191D] rounded-2xs"></div>
      </div>
    </div>
  </div>

  <!-- Header Section: Logo + Kanavu Illam -->
  <div class="flex flex-col items-center justify-center mt-2"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGXs_YllPLYQesvvLroOQEGYdW6ZkkptWoUGXZ2GRAd3msCFbRsXHdqCk5FGj1qU4_fzae7SMXP_k8D5LIBXpc20R48CEonGDvpjxP2reHlSkUeo5VIb160UKVqq9n1h2XNIYkJGdvg95ph_TI2w9S_cYRwbduGQG1MO1Yjn1MY96plrdqCZ_nltxOq1ICAQ24djEPx6bKb8c75nO-Xui5t3C5-k7j25i9kTtceOIJYFND9LGD7bSeBvrLZRWHLjj7_w" alt="Kanavu Illam Logo" class="h-[112px] w-auto object-contain"></div>

  <!-- Main White Card -->
  <div class="w-full bg-[#FCFDFF] border border-[#E9EAEC] rounded-[32px] p-6 shadow-[0_12px_32px_rgba(27,33,47,0.10)] mt-6 flex flex-col box-border">
    <!-- Title -->
    <h2 class="text-[28px] font-bold text-[#18191D] tracking-tight mb-6">Welcome back</h2>

    <!-- Inputs Container -->
    <div class="flex flex-col space-y-4">
      <!-- Input 1: Email or Phone -->
      <div class="input-field flex items-center h-[56px] px-4 bg-[#F4F7FB] border border-[#E2E8F0] rounded-[20px] transition-all">
        <svg class="w-5 h-5 text-[#8E94A0] flex-shrink-0 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <input type="text" placeholder="Email or Phone" class="w-full bg-transparent text-[#18191D] placeholder-[#8E94A0] text-[15px] font-medium focus:outline-none">
      </div>

      <!-- Input 2: Password -->
      <div class="input-field flex items-center h-[56px] px-4 bg-[#F4F7FB] border border-[#E2E8F0] rounded-[20px] transition-all">
        <svg class="w-5 h-5 text-[#8E94A0] flex-shrink-0 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <input id="passwordInput" type="password" placeholder="Password" class="w-full bg-transparent text-[#18191D] placeholder-[#8E94A0] text-[15px] font-medium focus:outline-none">
        <button type="button" onclick="togglePassword()" class="text-[#8E94A0] hover:text-[#18191D] focus:outline-none ml-2">
          <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Forgot Password? -->
    <div class="flex justify-end mt-3 mb-6">
      <a href="#" class="text-[14px] font-semibold text-[#364050] hover:text-[#18191D] transition-colors">Forgot Password?</a>
    </div>

    <!-- Sign in Button -->
    <button type="button" class="amber-btn w-full h-[56px] rounded-full flex items-center justify-center space-x-2 transition-transform active:scale-[0.98]">
      <span class="text-[16px] font-bold text-[#1E252D]">Sign in</span>
      <svg class="w-5 h-5 text-[#1E252D]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </button>
  </div>

  <!-- Bottom Link: Register -->
  <div class="flex items-center justify-center space-x-1.5 mt-6 mb-0">
    <span class="text-[15px] text-[#8E94A0]">Don't have an account?</span>
    <a href="#" class="text-[15px] font-bold text-[#18191D] underline decoration-1 underline-offset-2">Register</a>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }
  </script>




</body></html>
