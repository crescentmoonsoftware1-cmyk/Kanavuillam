<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanavu Illam - Report Downloaded</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-0 m-0">
  <!-- iPhone 390x844 Frame -->
  <div class="w-[390px] h-[844px] max-h-[844px] overflow-hidden relative flex flex-col justify-between" style="background: linear-gradient(180deg, #E9EEF4 0%, #D8DFE9 100%);">
    
    <!-- Status Bar -->
    <div class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold text-[#18191D] shrink-0 z-20">
      <span>9:41</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-4 h-3 text-[#18191D]" fill="currentColor" viewBox="0 0 16 12"><path d="M1 9h2a1 1 0 001-1V4a1 1 0 00-1-1H1a1 1 0 00-1 1v4a1 1 0 001 1zm4 1h2a1 1 0 001-1V3a1 1 0 00-1-1H5a1 1 0 00-1 1v6a1 1 0 001 1zm4 1h2a1 1 0 001-1V2a1 1 0 00-1-1H9a1 1 0 00-1 1v8a1 1 0 001 1zm4 1h2a1 1 0 001-1V1a1 1 0 00-1-1h-2a1 1 0 00-1 1v10a1 1 0 001 1z"/></svg>
        <svg class="w-3.5 h-3 text-[#18191D]" fill="currentColor" viewBox="0 0 16 12"><path d="M8 2.5a10.9 10.9 0 00-6.3 2A1 1 0 001.4 5.9l5.9 7.4a1 1 0 001.5 0l5.8-7.4a1 1 0 00-.3-1.4A10.9 10.9 0 008 2.5z"/></svg>
        <div class="w-5 h-2.5 border border-[#18191D] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3 bg-[#18191D] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto px-6 py-4 flex flex-col items-center justify-center text-center">
      
      <!-- Large 96px #2E3744 circle with check and amber ring #FBA73B -->
      <div class="w-24 h-24 rounded-full bg-[#2E3744] ring-4 ring-[#FBA73B] flex items-center justify-center mb-4 shadow-[0_12px_28px_rgba(27,33,47,0.18)]">
        <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <!-- Title & Subtitle -->
      <h1 class="text-[22px] font-bold text-[#18191D] leading-tight">
        Report Downloaded Successfully!
      </h1>
      <p class="text-xs text-[#8E94A0] mt-1.5 font-medium">
        How was your experience?
      </p>

      <!-- 5 Outlined Stars (#94A3B8) that fill with amber #E58A18 when selected -->
      <div class="flex items-center space-x-2.5 my-5">
        <!-- 4 stars filled with amber #E58A18 -->
        <button class="w-8 h-8 flex items-center justify-center text-[#E58A18] active:scale-110 transition-transform">
          <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
        <button class="w-8 h-8 flex items-center justify-center text-[#E58A18] active:scale-110 transition-transform">
          <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
        <button class="w-8 h-8 flex items-center justify-center text-[#E58A18] active:scale-110 transition-transform">
          <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
        <button class="w-8 h-8 flex items-center justify-center text-[#E58A18] active:scale-110 transition-transform">
          <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
        <!-- 5th star outlined in #94A3B8 -->
        <button class="w-8 h-8 flex items-center justify-center text-[#94A3B8] active:scale-110 transition-transform">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </button>
      </div>

      <!-- Feedback Multiline Text Field Card -->
      <div class="w-full bg-[#FCFDFF] rounded-[20px] p-3.5 border border-[#E2E8F0] shadow-sm mb-6 text-left">
        <textarea rows="3" class="w-full bg-transparent text-xs text-[#18191D] placeholder-[#94A3B8] focus:outline-none resize-none font-normal" placeholder="Share your feedback with us (optional)..."></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="w-full space-y-2.5">
        <!-- Primary Pill Button: Submit Feedback -->
        <button class="w-full h-14 rounded-full flex items-center justify-center font-bold text-sm tracking-wide text-[#1E252D] shadow-[0_8px_24px_rgba(229,138,24,0.35)] active:scale-[0.98] transition-transform" style="background: linear-gradient(135deg, #FBA73B 0%, #E58A18 100%);">
          Submit Feedback
        </button>

        <!-- Secondary Pill Button: Exit to Home -->
        <button class="w-full h-14 rounded-full bg-[#FCFDFF] border border-[#E2E8F0] flex items-center justify-center space-x-2 font-bold text-sm text-[#18191D] shadow-sm active:scale-[0.98] transition-transform">
          <svg class="w-4 h-4 text-[#18191D]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Exit to Home</span>
        </button>
      </div>

    </div>

    <!-- iOS Home Indicator -->
    <div class="w-full pb-4 pt-1 flex justify-center shrink-0">
      <div class="w-32 h-1 bg-[#18191D]/30 rounded-full"></div>
    </div>

  </div>
</body>
</html>
