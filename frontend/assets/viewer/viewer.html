    // ─── GEOMETRY LOCK HASH ────────────────────────────────────────────────
    async function hashGeometry(data) {
      const canonical = {
        rooms: data.rooms?.map(r => ({ id: r.id, polygon: r.polygon })),
        sub_spaces: data.sub_spaces?.map(r => ({ id: r.id, polygon: r.polygon })),
        walls: data.walls?.map(w => ({ id: w.id, start: w.start, end: w.end, thickness: w.thickness })),
        openings: data.openings?.map(o => ({ id: o.id, start: o.start, end: o.end, type: o.type })),
        furniture: data.furniture?.map(f => ({ id: f.id, type: f.type, polygon: f.polygon })),
        vehicles: data.vehicles?.map(v => ({ id: v.id, type: v.type, polygon: v.polygon }))
      };
      const str = JSON.stringify(canonical);
      const encoder = new TextEncoder();
      const buffer = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    let currentGeometryHash = null;

    // ─── REBUILD ENGINE ────────────────────────────────────────────────────
    async function rebuildAll(data) {
      const ld = document.getElementById('ld');
      const ldTxt = document.getElementById('ld-txt');
      if (ld) ld.style.display = 'flex';

      if (ldTxt) ldTxt.innerText = 'Analyzing architectural plan...';
      await new Promise(r => setTimeout(r, 20));

      // Calculate initial Geometry Lock Hash
      currentGeometryHash = await hashGeometry(data);
      console.log("🔒 Initial Geometry Hash:", currentGeometryHash);

      while (archGrp.children.length) archGrp.remove(archGrp.children[0]);
      while (furnGrp.children.length) furnGrp.remove(furnGrp.children[0]);
      while (envGrp.children.length) envGrp.remove(envGrp.children[0]);
      while (dbgGrp.children.length) dbgGrp.remove(dbgGrp.children[0]);
      while (ceilGrp.children.length) ceilGrp.remove(ceilGrp.children[0]);
      animatedFans = [];

      if (ldTxt) ldTxt.innerText = 'Configuring studio lighting...';
      await new Promise(r => setTimeout(r, 20));

      if (state.light) {
        const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
        envGrp.add(ambLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x64748b, 0.45);
        envGrp.add(hemiLight);

        const sun = new THREE.DirectionalLight(0xfffdf0, 1.15);
        sun.position.set(70, 110, 70);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 4096;
        sun.shadow.mapSize.height = 4096;
        sun.shadow.camera.left = -120;
        sun.shadow.camera.right = 120;
        sun.shadow.camera.top = 120;
        sun.shadow.camera.bottom = -120;
        sun.shadow.camera.near = 10;
        sun.shadow.camera.far = 400;
        sun.shadow.bias = -0.0003;
        sun.shadow.radius = 2.0;
        envGrp.add(sun);

        const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.4);
        fillLight.position.set(-60, 80, -60);
        envGrp.add(fillLight);

        const gndGeo = new THREE.PlaneGeometry(1200, 1200);
        const gndMat = new THREE.MeshStandardMaterial({ color: 0x8fa0b2, roughness: 0.95, metalness: 0.0 });
        const gnd = new THREE.Mesh(gndGeo, gndMat);
        gnd.rotation.x = -Math.PI / 2;
        gnd.position.y = -0.05;
        gnd.receiveShadow = true;
        envGrp.add(gnd);
      } else {
        envGrp.add(new THREE.AmbientLight(0xffffff, 1.0));
      }

      if (ldTxt) ldTxt.innerText = 'Building deterministic geometry...';
      await new Promise(r => setTimeout(r, 20));

      // Coordinate System Definition
      // CV (x, y) -> World (X, 0, Z)
      // 1 unit = 1 foot

      function getPtX(pt) {
        if (!pt) return 0;
        if (typeof pt.x === 'number') return pt.x;
        if (Array.isArray(pt) && typeof pt[0] === 'number') return pt[0];
        if (typeof pt.x === 'string') return parseFloat(pt.x) || 0;
        if (Array.isArray(pt) && typeof pt[0] === 'string') return parseFloat(pt[0]) || 0;
        return 0;
      }

      function getPtY(pt) {
        if (!pt) return 0;
        if (typeof pt.y === 'number') return pt.y;
        if (Array.isArray(pt) && typeof pt[1] === 'number') return pt[1];
        if (typeof pt.y === 'string') return parseFloat(pt.y) || 0;
        if (Array.isArray(pt) && typeof pt[1] === 'string') return parseFloat(pt[1]) || 0;
        return 0;
      }

      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      const isCanonical = data.schema_version === "1.0" || data.schema_version === "2.0" || (curData && (curData.schema_version === "1.0" || curData.schema_version === "2.0"));

      (data.rooms || []).forEach(r => {
        (r.polygon || []).forEach(pt => {
          const px = getPtX(pt);
          const pz = getPtY(pt);
          if (px < minX) minX = px; if (px > maxX) maxX = px;
          if (pz < minZ) minZ = pz; if (pz > maxZ) maxZ = pz;
        });
      });
      const cx = (minX === Infinity) ? 0 : (minX + maxX) / 2;
      const cz = (minZ === Infinity) ? 0 : (minZ + maxZ) / 2;

      function distToSegment(px, pz, x1, z1, x2, z2) {
        const l2 = (x2 - x1) * (x2 - x1) + (z2 - z1) * (z2 - z1);
        if (l2 === 0) return Math.hypot(px - x1, pz - z1);
        let t = ((px - x1) * (x2 - x1) + (pz - z1) * (z2 - z1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * (x2 - x1)), pz - (z1 + t * (z2 - z1)));
      }

      // Calculate plot outer boundaries and indoor house room bounding box
      let plotMinX = Infinity, plotMaxX = -Infinity, plotMinZ = Infinity, plotMaxZ = -Infinity;
      (data.walls || []).forEach(w => {
        if (!w.start || !w.end) return;
        const sx = getPtX(w.start) - cx;
        const sz = getPtY(w.start) - cz;
        const ex = getPtX(w.end) - cx;
        const ez = getPtY(w.end) - cz;
        if (sx < plotMinX) plotMinX = sx; if (sx > plotMaxX) plotMaxX = sx;
        if (ex < plotMinX) plotMinX = ex; if (ex > plotMaxX) plotMaxX = ex;
        if (sz < plotMinZ) plotMinZ = sz; if (sz > plotMaxZ) plotMaxZ = sz;
        if (ez < plotMinZ) plotMinZ = ez; if (ez > plotMaxZ) plotMaxZ = ez;
      });

      let houseMinX = Infinity, houseMaxX = -Infinity, houseMinZ = Infinity, houseMaxZ = -Infinity;
      (data.rooms || []).forEach(r => {
        const rName = String(r.name || r.label || '').toLowerCase();
        // Strictly consider INDOOR rooms only for house bounding box
        const isIndoor = rName.includes('kitchen') || rName.includes('dining') || rName.includes('living') ||
          rName.includes('hall') || rName.includes('bedroom') || rName.includes('toilet') ||
          rName.includes('bath') || rName.includes('puja') || rName.includes('pooja') ||
          rName.includes('bed') || rName.includes('store') || rName.includes('utility');
        const isOutdoor = rName.includes('compound') || rName.includes('setback') || rName.includes('yard') ||
          rName.includes('boundary') || rName.includes('outdoor') || rName.includes('portico') ||
          rName.includes('porch') || rName.includes('parking');

        if (isIndoor && !isOutdoor) {
          (r.polygon || []).forEach(pt => {
            const px = getPtX(pt) - cx;
            const pz = getPtY(pt) - cz;
            if (px < houseMinX) houseMinX = px; if (px > houseMaxX) houseMaxX = px;
            if (pz < houseMinZ) houseMinZ = pz; if (pz > houseMaxZ) houseMaxZ = pz;
          });
        }
      });

      // 1. OPENING COLLECTION & CATEGORIZATION
      const allOpenings = [];
      const addedIds = new Set();

      function getOpeningCategory(item, defaultType) {
        const typeStr = String(item.type || item.openingType || defaultType || '').toUpperCase();
        const labelStr = String(item.label || item.name || item.id || item.source_id || '').toUpperCase();

        if (labelStr === 'O' || labelStr === '0' || labelStr.startsWith('OPEN') || typeStr.includes('ARCH') || typeStr === 'OPENING') {
          return 'archway';
        }
        if (labelStr === 'MG' || labelStr.includes('GATE') || typeStr.includes('GATE') || typeStr === 'MAIN_GATE') {
          return 'gate';
        }
        if (labelStr.startsWith('W') || labelStr.startsWith('V') || typeStr.includes('WIN') || typeStr === 'WINDOW' || typeStr.includes('VENT')) {
          return 'window';
        }
        if (labelStr.startsWith('MD') || labelStr.startsWith('D') || labelStr.startsWith('PD') || labelStr.startsWith('SD') || typeStr.includes('DOOR') || typeStr === 'DOOR') {
          return 'door';
        }
        return (defaultType || 'window').toLowerCase();
      }

      function addOp(item, defaultType) {
        if (!item) return;
        const itemID = item.id || item.source_id || (defaultType + '_' + Math.random().toString(36).substr(2, 5));
        if (addedIds.has(itemID)) return;
        addedIds.add(itemID);
        const finalCategory = getOpeningCategory(item, defaultType);
        allOpenings.push({ ...item, id: itemID, openingCategory: finalCategory });
      }

      (data.doors || []).forEach(d => addOp(d, 'door'));
      (data.windows || []).forEach(w => addOp(w, 'window'));
      (data.openings || []).forEach(op => addOp(op, op.type || 'opening'));

      // AUTOMATED FALLBACK: If 0 doors detected in 2D layout, synthesize 3D door openings for indoor rooms
      const existingDoorCount = allOpenings.filter(o => o.openingCategory === 'door').length;
      if (existingDoorCount === 0 && (data.rooms || []).length > 0) {
        let autoDIdx = 1;
        (data.rooms || []).forEach(r => {
          if (!r.polygon || r.polygon.length < 3) return;
          const rName = String(r.name || r.label || '').toLowerCase();
          
          // Find longest wall segment for this room
          let bestP1 = null, bestP2 = null, maxLen = 0;
          for (let i = 0; i < r.polygon.length; i++) {
            const p1 = r.polygon[i];
            const p2 = r.polygon[(i + 1) % r.polygon.length];
            const p1x = getPtX(p1);
            const p1y = getPtY(p1);
            const p2x = getPtX(p2);
            const p2y = getPtY(p2);
            const len = Math.hypot(p2x - p1x, p2y - p1y);
            if (len > maxLen) {
              maxLen = len;
              bestP1 = { x: p1x, y: p1y };
              bestP2 = { x: p2x, y: p2y };
            }
          }

          if (bestP1 && bestP2 && maxLen >= 2.0) {
            const midX = (bestP1.x + bestP2.x) / 2;
            const midY = (bestP1.y + bestP2.y) / 2;
            const isMain = rName.includes('living') || rName.includes('hall') || rName.includes('portico');
            const isToilet = rName.includes('toilet') || rName.includes('bath') || rName.includes('wc');

            addOp({
              id: `auto_door_${autoDIdx++}`,
              type: 'DOOR',
              label: isMain ? 'MD' : (isToilet ? 'D1' : 'D'),
              position: { x: midX, y: midY },
              width_ft: isMain ? 3.5 : (isToilet ? 2.2 : 3.0)
            }, 'door');
          }
        });
      }

      // Pre-calculate 3D segment coordinates for all openings
      const processedOpenings3D = [];
      allOpenings.forEach(op => {
        let sx, sz, ex, ez, len, ang = 0, thick = 0.5;
        const category = op.openingCategory || 'window';

        if (op.position) {
          const cx_pos = getPtX(op.position) - cx;
          const cz_pos = getPtY(op.position) - cz;
          len = op.width_ft || op.width || 3.0;

          let bestWall = null;
          let bestDist = Infinity;
          let bestAng = 0;
          let bestThick = 0.5;
          let bestSnapX = cx_pos;
          let bestSnapZ = cz_pos;

          (data.walls || []).forEach(w => {
            const wsx = w.start ? (getPtX(w.start) - cx) : (w.sx || 0);
            const wsz = w.start ? (getPtY(w.start) - cz) : (w.sz || 0);
            const wex = w.end ? (getPtX(w.end) - cx) : (w.ex || 0);
            const wez = w.end ? (getPtY(w.end) - cz) : (w.ez || 0);

            const wdx = wex - wsx, wdz = wez - wsz;
            const wLenSq = wdx * wdx + wdz * wdz;
            if (wLenSq < 0.01) return;
            const wLen = Math.sqrt(wLenSq);

            let t = ((cx_pos - wsx) * wdx + (cz_pos - wsz) * wdz) / wLenSq;
            const dist = distToSegment(cx_pos, cz_pos, wsx, wsz, wex, wez);

            // Give preference to wall matching op.wall_id
            const isTargetWall = (op.wall_id && (w.source_id === op.wall_id || w.id === op.wall_id));
            let score = dist + ((t >= 0.02 && t <= 0.98) ? 0 : 3.0) - (isTargetWall ? 2.0 : 0);

            if (score < bestDist) {
              bestDist = score;
              bestWall = w;
              bestAng = -Math.atan2(wdz, wdx);
              bestThick = w.thickness_ft || w.thick || 0.5;

              // Clamp t so opening doesn't protrude past wall corners
              const halfTFraction = Math.min(0.45, (len / 2) / wLen);
              const clampedT = Math.max(halfTFraction, Math.min(1.0 - halfTFraction, t));
              bestSnapX = wsx + clampedT * wdx;
              bestSnapZ = wsz + clampedT * wdz;
            }
          });

          if (bestWall) {
            ang = bestAng;
            thick = bestThick;
            sx = bestSnapX - (Math.cos(-ang) * len / 2);
            sz = bestSnapZ - (Math.sin(-ang) * len / 2);
            ex = bestSnapX + (Math.cos(-ang) * len / 2);
            ez = bestSnapZ + (Math.sin(-ang) * len / 2);
          } else {
            sx = cx_pos - len / 2; sz = cz_pos;
            ex = cx_pos + len / 2; ez = cz_pos;
          }
        } else if (op.start && op.end) {
          sx = getPtX(op.start) - cx;
          sz = getPtY(op.start) - cz;
          ex = getPtX(op.end) - cx;
          ez = getPtY(op.end) - cz;
          thick = op.thickness || 0.5;
          const dx = ex - sx, dz = ez - sz;
          len = Math.hypot(dx, dz);
          if (len < 0.05) return;
          ang = -Math.atan2(dz, dx);
        } else return;

        processedOpenings3D.push({ ...op, sx, sz, ex, ez, len, ang, thick, cx_op: (sx + ex) / 2, cz_op: (sz + ez) / 2, category });
      });

      const WALL_HEIGHT = 10.0;
      const COMPOUND_WALL_HEIGHT = 5.0;
      const wallMat = getMat('wall');
      const compoundWallMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.75, metalness: 0.05 });
      const wallTopMat = getMat('wall_top');
      const createdWallBoundingBoxes = [];

      // Helper: Subdivide wall segment and cut out solid wall inside door/window spaces
      function buildWallSegmentWithOpenings(sx, sz, ex, ez, thick, isCompound, sourceId) {
        const dx = ex - sx, dz = ez - sz;
        const totalLen = Math.hypot(dx, dz);
        if (totalLen < 0.05) return;
        const ang = -Math.atan2(dz, dx);
        const height = isCompound ? COMPOUND_WALL_HEIGHT : WALL_HEIGHT;
        const curWallMat = isCompound ? compoundWallMat : wallMat;

        // Find openings on this segment
        const segmentOpenings = [];
        processedOpenings3D.forEach(op => {
          const d = distToSegment(op.cx_op, op.cz_op, sx, sz, ex, ez);
          if (d < 1.0) {
            const l2 = dx * dx + dz * dz;
            let t = l2 > 0 ? ((op.cx_op - sx) * dx + (op.cz_op - sz) * dz) / l2 : 0;
            t = Math.max(0, Math.min(1, t));
            const halfT = (op.len / 2) / totalLen;
            const t1 = Math.max(0, t - halfT);
            const t2 = Math.min(1, t + halfT);
            if (t2 - t1 > 0.01) {
              segmentOpenings.push({ t1, t2, op, category: op.category });
            }
          }
        });

        segmentOpenings.sort((a, b) => a.t1 - b.t1);

        // Subdivide [0, 1] interval
        let currentT = 0;
        const intervals = [];
        segmentOpenings.forEach(so => {
          if (so.t1 > currentT + 0.01) {
            intervals.push({ t1: currentT, t2: so.t1, isOpening: false });
          }
          intervals.push({ t1: Math.max(currentT, so.t1), t2: so.t2, isOpening: true, op: so.op, category: so.category });
          currentT = Math.max(currentT, so.t2);
        });

        if (currentT < 0.99) {
          intervals.push({ t1: currentT, t2: 1.0, isOpening: false });
        }

        intervals.forEach(inv => {
          const subLen = (inv.t2 - inv.t1) * totalLen;
          if (subLen < 0.05) return;
          const subMidX = sx + ((inv.t1 + inv.t2) / 2) * dx;
          const subMidZ = sz + ((inv.t1 + inv.t2) / 2) * dz;

          if (!inv.isOpening) {
            // Non-opening part: FULL HEIGHT SOLID WALL
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(subLen, height, thick), curWallMat);
            mesh.position.set(subMidX, height / 2, subMidZ);
            mesh.rotation.y = ang;
            mesh.castShadow = true; mesh.receiveShadow = true;
            mesh.userData = { sourceType: 'wall', sourceId: sourceId, isCompound: isCompound };
            archGrp.add(mesh);

            const topCap = new THREE.Mesh(new THREE.BoxGeometry(subLen, 0.05, thick + 0.02), wallTopMat);
            topCap.position.set(subMidX, height + 0.025, subMidZ);
            topCap.rotation.y = ang;
            archGrp.add(topCap);
          } else {
            // Opening part: Render ONLY Lintel and Wall Sill, leaving TRUE VOID in middle!
            if (!isCompound && inv.category !== 'gate') {
              const lintelH = 3.0; // Y=7 to 10ft
              const lintel = new THREE.Mesh(new THREE.BoxGeometry(subLen, lintelH, thick), wallMat);
              lintel.position.set(subMidX, WALL_HEIGHT - lintelH / 2, subMidZ);
              lintel.rotation.y = ang;
              lintel.castShadow = true; lintel.receiveShadow = true;
              lintel.userData = { sourceType: 'opening', sourceId: inv.op.id, openingType: inv.category };
              archGrp.add(lintel);
            }

            if (inv.category === 'window' && !isCompound) {
              const winBaseY = 3.0; // Y=0 to 3ft
              const wallSill = new THREE.Mesh(new THREE.BoxGeometry(subLen, winBaseY, thick), wallMat);
              wallSill.position.set(subMidX, winBaseY / 2, subMidZ);
              wallSill.rotation.y = ang;
              wallSill.castShadow = true; wallSill.receiveShadow = true;
              archGrp.add(wallSill);
            }
          }
        });

        createdWallBoundingBoxes.push({ sx, sz, ex, ez, len: totalLen, ang, height, thick, source_id: sourceId, isCompound });
      }

      // 1A. WALL GENERATION FROM DATA.WALLS
      (data.walls || []).forEach(w => {
        if (!w.start || !w.end) return;
        const sx = getPtX(w.start) - cx;
        const sz = getPtY(w.start) - cz;
        const ex = getPtX(w.end) - cx;
        const ez = getPtY(w.end) - cz;
        const thick = w.thickness_ft || w.thickness || 0.5;

        const sourceIdStr = String(w.source_id || w.id || w.name || w.type || '').toLowerCase();
        const isCompound = w.is_compound === true ||
          w.type === 'compound' ||
          w.type === 'boundary' ||
          w.type === 'compound_wall' ||
          sourceIdStr.includes('compound') ||
          sourceIdStr.includes('boundary') ||
          sourceIdStr.includes('parapet') ||
          sourceIdStr.includes('plot_boundary');

        buildWallSegmentWithOpenings(sx, sz, ex, ez, thick, isCompound, w.source_id || w.id);
      });

      // 1B. SYNTHESIZE MISSING WALLS FROM ROOM POLYGON EDGES (Only fills uncovered EXTERIOR house boundary gaps)
      (data.rooms || []).forEach(r => {
        if (!r.polygon || r.polygon.length < 3) return;
        const pts = r.polygon;
        const rName = String(r.name || r.label || '').toLowerCase();
        const isOpenSpace = rName.includes('portico') || rName.includes('porch') || rName.includes('parking') ||
          rName.includes('car') || rName.includes('veranda') || rName.includes('balcony') ||
          rName.includes('terrace') || rName.includes('compound') || rName.includes('yard') ||
          rName.includes('boundary') || rName.includes('setback') || rName.includes('passage');

        // Do not synthesize solid enclosing walls around open or semi-outdoor spaces!
        if (isOpenSpace) return;

        for (let i = 0; i < pts.length; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % pts.length];
          const p1x = getPtX(p1) - cx;
          const p1z = getPtY(p1) - cz;
          const p2x = getPtX(p2) - cx;
          const p2z = getPtY(p2) - cz;

          const dx = p2x - p1x, dz = p2z - p1z;
          const len = Math.hypot(dx, dz);
          if (len < 0.5) continue;

          // Only synthesize if this edge lies on the EXTERIOR perimeter of the house
          const midX = (p1x + p2x) / 2.0;
          const midZ = (p1z + p2z) / 2.0;
          const isExteriorBoundary = (Math.abs(midX - houseMinX) < 2.0 || Math.abs(midX - houseMaxX) < 2.0 ||
            Math.abs(midZ - houseMinZ) < 2.0 || Math.abs(midZ - houseMaxZ) < 2.0);

          if (!isExteriorBoundary) continue;

          // Check sub-intervals along edge to find uncovered gaps
          const subStepFt = 1.5;
          const numSteps = Math.max(1, Math.ceil(len / subStepFt));
          let missingSegments = [];
          let currentMissing = null;

          for (let s = 0; s < numSteps; s++) {
            const tStart = s / numSteps;
            const tEnd = (s + 1) / numSteps;
            const tMid = (tStart + tEnd) / 2;
            const mx_pt = p1x + tMid * dx;
            const mz_pt = p1z + tMid * dz;

            // Coverage check with 2.0ft tolerance to prevent duplicate double walls
            const isCovered = createdWallBoundingBoxes.some(wb => distToSegment(mx_pt, mz_pt, wb.sx, wb.sz, wb.ex, wb.ez) < 2.0);
            if (!isCovered) {
              if (!currentMissing) currentMissing = { tStart: tStart, tEnd: tEnd };
              else currentMissing.tEnd = tEnd;
            } else {
              if (currentMissing) {
                missingSegments.push(currentMissing);
                currentMissing = null;
              }
            }
          }
          if (currentMissing) missingSegments.push(currentMissing);

          missingSegments.forEach(seg => {
            const segP1x = p1x + seg.tStart * dx;
            const segP1z = p1z + seg.tStart * dz;
            const segP2x = p1x + seg.tEnd * dx;
            const segP2z = p1z + seg.tEnd * dz;
            const segDx = segP2x - segP1x, segDz = segP2z - segP1z;
            const segLen = Math.hypot(segDx, segDz);
            if (segLen < 0.4) return;

            const thick = 0.4;
            buildWallSegmentWithOpenings(segP1x, segP1z, segP2x, segP2z, thick, false, 'syn_' + (r.id || 'r') + '_' + i);
          });
        }
      });

      // 2. RENDER 3D VISUAL DOOR LEAF, WINDOW GLASS & ARCHWAY PASSAGES
      processedOpenings3D.forEach(op => {
        const { sx, sz, ex, ez, len, ang, thick, category } = op;

        if (state.arch) {
          const frameMat = getMat('frame');
          const frameThick = thick + 0.06;
          const frameDepth = 0.12;

          const isWin = category === 'window';
          const opH = isWin ? 4.0 : 7.0;
          const opCenterY = isWin ? 5.0 : 3.5;
          const topY = isWin ? 7.0 : 7.0;

          const jambLeft = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, opH, frameThick), frameMat);
          jambLeft.position.set(sx, opCenterY, sz);
          jambLeft.rotation.y = ang;
          jambLeft.translateX(frameDepth / 2);

          const jambRight = new THREE.Mesh(new THREE.BoxGeometry(frameDepth, opH, frameThick), frameMat);
          jambRight.position.set(ex, opCenterY, ez);
          jambRight.rotation.y = ang;
          jambRight.translateX(-frameDepth / 2);

          const headJamb = new THREE.Mesh(new THREE.BoxGeometry(len, frameDepth, frameThick), frameMat);
          headJamb.position.set((sx + ex) / 2, topY - frameDepth / 2, (sz + ez) / 2);
          headJamb.rotation.y = ang;

          archGrp.add(jambLeft, jambRight, headJamb);

          if (isWin) {
            const winHeight = 4.0;
            const winBaseY = 3.0;

            let winFrameMat = getMat('wood_frame');
            if (state.windowStyle === 'upvc') winFrameMat = getMat('upvc_frame');
            if (state.windowStyle === 'black') winFrameMat = getMat('black_frame');

            const sillDepth = thick + 0.16;
            const sillHeight = 0.18;
            const sillLedge = new THREE.Mesh(new THREE.BoxGeometry(len + 0.25, sillHeight, sillDepth), winFrameMat);
            sillLedge.position.set((sx + ex) / 2, winBaseY + sillHeight / 2, (sz + ez) / 2);
            sillLedge.rotation.y = ang;
            sillLedge.castShadow = true; sillLedge.receiveShadow = true;
            archGrp.add(sillLedge);

            const glassWidth = len - frameDepth * 2;
            const glassHeight = winHeight - frameDepth * 2;
            const glassMat = state.windowStyle === 'black' ?
              new THREE.MeshPhysicalMaterial({ color: 0x384554, transmission: 0.7, opacity: 0.85, transparent: true, roughness: 0.1, reflectivity: 0.8 }) :
              getMat('glass');

            const glassMesh = new THREE.Mesh(new THREE.BoxGeometry(glassWidth, glassHeight, 0.05), glassMat);
            glassMesh.position.set((sx + ex) / 2, winBaseY + winHeight / 2, (sz + ez) / 2);
            glassMesh.rotation.y = ang;
            archGrp.add(glassMesh);

            if (state.windowStyle === 'wood') {
              const vertMullion = new THREE.Mesh(new THREE.BoxGeometry(0.1, glassHeight, 0.08), winFrameMat);
              vertMullion.position.set((sx + ex) / 2, winBaseY + winHeight / 2, (sz + ez) / 2);
              vertMullion.rotation.y = ang;
              const horizMullion = new THREE.Mesh(new THREE.BoxGeometry(glassWidth, 0.1, 0.08), winFrameMat);
              horizMullion.position.set((sx + ex) / 2, winBaseY + winHeight / 2, (sz + ez) / 2);
              horizMullion.rotation.y = ang;
              archGrp.add(vertMullion, horizMullion);
            } else if (state.windowStyle === 'upvc') {
              const midDivider = new THREE.Mesh(new THREE.BoxGeometry(0.12, glassHeight, 0.12), winFrameMat);
              midDivider.position.set((sx + ex) / 2, winBaseY + winHeight / 2, (sz + ez) / 2);
              midDivider.rotation.y = ang;
              archGrp.add(midDivider);
            } else if (state.windowStyle === 'black') {
              [-glassWidth / 4, glassWidth / 4].forEach(xOff => {
                const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, glassHeight, 0.08), winFrameMat);
                bar.position.set((sx + ex) / 2 + Math.cos(-ang) * xOff, winBaseY + winHeight / 2, (sz + ez) / 2 + Math.sin(-ang) * xOff);
                bar.rotation.y = ang;
                archGrp.add(bar);
              });
            }

          } else if (category === 'door') {
            const leafMat = getMat('door');
            const handleMat = state.doorStyle === 'glass' ? getMat('black_handle') : (state.doorStyle === 'teak' ? getMat('steel') : getMat('brass'));
            const leafWidth = len - frameDepth * 2;
            const leafHeight = 6.8;
            const leafThick = 0.14;

            const pivot = new THREE.Group();
            pivot.position.set(sx, 3.4, sz);
            pivot.rotation.y = ang;
            pivot.translateX(frameDepth);

            const leafMesh = new THREE.Mesh(new THREE.BoxGeometry(leafWidth, leafHeight, leafThick), leafMat);
            leafMesh.position.set(leafWidth / 2, 0, 0);
            leafMesh.castShadow = true; leafMesh.receiveShadow = true;
            pivot.add(leafMesh);

            if (state.doorStyle === 'glass') {
              const glassInsertW = leafWidth * 0.26;
              const glassInsertH = leafHeight * 0.78;
              const glassInsert = new THREE.Mesh(
                new THREE.BoxGeometry(glassInsertW, glassInsertH, leafThick + 0.04),
                getMat('frosted_glass')
              );
              glassInsert.position.set(leafWidth * 0.28, 0, 0);
              leafMesh.add(glassInsert);

              const handleBarH = 3.0;
              const handleBarFront = new THREE.Mesh(new THREE.BoxGeometry(0.07, handleBarH, 0.07), handleMat);
              handleBarFront.position.set(leafWidth - 0.22, 0, leafThick / 2 + 0.07);

              const handleBarBack = new THREE.Mesh(new THREE.BoxGeometry(0.07, handleBarH, 0.07), handleMat);
              handleBarBack.position.set(leafWidth - 0.22, 0, -leafThick / 2 - 0.07);

              [-handleBarH / 2 + 0.15, handleBarH / 2 - 0.15].forEach(yPos => {
                const mountF = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.07), handleMat);
                mountF.position.set(leafWidth - 0.22, yPos, leafThick / 2 + 0.035);
                const mountB = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.07), handleMat);
                mountB.position.set(leafWidth - 0.22, yPos, -leafThick / 2 - 0.035);
                leafMesh.add(mountF, mountB);
              });

              leafMesh.add(handleBarFront, handleBarBack);

            } else if (state.doorStyle === 'teak') {
              const handleBarH = 3.4;
              const barFront = new THREE.Mesh(new THREE.BoxGeometry(0.07, handleBarH, 0.07), handleMat);
              barFront.position.set(leafWidth - 0.2, 0, leafThick / 2 + 0.07);
              const barBack = new THREE.Mesh(new THREE.BoxGeometry(0.07, handleBarH, 0.07), handleMat);
              barBack.position.set(leafWidth - 0.2, 0, -leafThick / 2 - 0.07);
              leafMesh.add(barFront, barBack);

            } else {
              const plateF = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.48, 0.04), handleMat);
              plateF.position.set(leafWidth - 0.25, 0, leafThick / 2 + 0.02);
              const plateB = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.48, 0.04), handleMat);
              plateB.position.set(leafWidth - 0.25, 0, -leafThick / 2 - 0.02);
              const leverF = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.06), handleMat);
              leverF.position.set(leafWidth - 0.32, 0, leafThick / 2 + 0.09);
              const leverB = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.06), handleMat);
              leverB.position.set(leafWidth - 0.32, 0, -leafThick / 2 - 0.09);
              leafMesh.add(plateF, plateB, leverF, leverB);
            }

            pivot.rotation.y += (Math.PI / 180) * 45;
            archGrp.add(pivot);
          } else if (category === 'archway') {
            // OPEN ARCHWAY ('O'): Clean opening passage without door leaf
          } else if (category === 'gate') {
            // MAIN GATE ('MG'): Gate in Compound Wall
          }

          if (state.dbg) {
            const sp = createTextSprite(op.label || op.id || 'opening', '#f59e0b');
            sp.position.set((sx + ex) / 2, WALL_HEIGHT - 3.0 / 2 - 1.0, (sz + ez) / 2);
            dbgGrp.add(sp);
          }
        }
      });

      // 3. FLOOR GENERATION
      (data.rooms || []).forEach(r => {
        if (!r.polygon || r.polygon.length < 3) return;

        // Ensure CCW winding order so floor face normal faces UP towards light
        let polyArea = 0;
        for (let i = 0; i < r.polygon.length; i++) {
          const p1 = r.polygon[i];
          const p2 = r.polygon[(i + 1) % r.polygon.length];
          polyArea += (getPtX(p1) * getPtY(p2) - getPtX(p2) * getPtY(p1));
        }
        const pts = polyArea < 0 ? [...r.polygon].reverse() : r.polygon;

        const shape = new THREE.Shape();
        const pLast = pts[pts.length - 1];
        shape.moveTo(getPtX(pLast) - cx, getPtY(pLast) - cz);
        for (let i = pts.length - 2; i >= 0; i--) {
          shape.lineTo(getPtX(pts[i]) - cx, getPtY(pts[i]) - cz);
        }

        let rCx = 0, rCz = 0;
        let rMinX = Infinity, rMaxX = -Infinity, rMinZ = Infinity, rMaxZ = -Infinity;
        pts.forEach(p => {
          const px = getPtX(p);
          const pz = getPtY(p);
          rCx += px - cx; rCz += pz - cz;
          if (px - cx < rMinX) rMinX = px - cx; if (px - cx > rMaxX) rMaxX = px - cx;
          if (pz - cz < rMinZ) rMinZ = pz - cz; if (pz - cz > rMaxZ) rMaxZ = pz - cz;
        });
        rCx /= pts.length; rCz /= pts.length;
        const rw = rMaxX - rMinX;
        const rd = rMaxZ - rMinZ;
        const effectiveLabel = r.name || r.label || 'Unknown';
        const mat = getMat('floor', effectiveLabel);
        mat.side = THREE.DoubleSide; // Prevents winding issues causing invisible floors
        const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.y = 0.02;
        mesh.receiveShadow = true;
        mesh.userData = { sourceType: 'room', sourceId: r.id, roomLabel: effectiveLabel };
        archGrp.add(mesh);

        // Ceiling (Phase 3.3)
        if (state.arch) {
          const ceilMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 });
          ceilMat.side = THREE.DoubleSide;
          const ceilMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), ceilMat);
          ceilMesh.rotation.x = -Math.PI / 2;
          ceilMesh.position.y = WALL_HEIGHT; // Cap the room
          ceilMesh.castShadow = true; ceilMesh.receiveShadow = true;
          ceilGrp.add(ceilMesh);
        }

        const sp = createTextSprite(effectiveLabel.toUpperCase(), '#0284c7');
        sp.position.set(rCx, 0.15, rCz);
        archGrp.add(sp);

        if (state.dbg) {
          const dbgSp = createTextSprite(r.id || 'room', '#10b981');
          dbgSp.position.set(rCx, 1.5, rCz);
          dbgGrp.add(dbgSp);

          // Draw Bounding Box outline
          const bbGeo = new THREE.BoxGeometry(rw, 0.1, rd);
          const bbMat = new THREE.MeshBasicMaterial({ color: 0x10b981, wireframe: true });
          const bbMesh = new THREE.Mesh(bbGeo, bbMat);
          bbMesh.position.set(rCx, 0.1, rCz);
          dbgGrp.add(bbMesh);
        }

        if (state.light) {
          const roomLight = new THREE.PointLight(0xfff7ed, 0.45, 22);
          roomLight.position.set(rCx, WALL_HEIGHT - 1.0, rCz);
          envGrp.add(roomLight);
        }
      });

      // 4. SUB-SPACES GENERATION (Wardrobes, etc.)
      (data.sub_spaces || []).forEach(r => {
        if (!r.polygon || r.polygon.length < 3) return;
        const shape = new THREE.Shape();
        const pLast = r.polygon[r.polygon.length - 1];
        shape.moveTo(getPtX(pLast) - cx, getPtY(pLast) - cz);
        for (let i = r.polygon.length - 2; i >= 0; i--) {
          shape.lineTo(getPtX(r.polygon[i]) - cx, getPtY(r.polygon[i]) - cz);
        }

        const effectiveLabel = r.name || r.label || 'Unknown';
        const mat = getMat('floor', effectiveLabel);
        mat.side = THREE.DoubleSide;
        const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.y = 0.03;
        mesh.receiveShadow = true;
        mesh.userData = { sourceType: 'sub_space', sourceId: r.id, roomLabel: effectiveLabel };
        archGrp.add(mesh);
      });

      // 4.5. ANIMATED CEILING FANS GENERATION (Always visible & spinning)
      (data.rooms || []).forEach(r => {
        if (!r.polygon || r.polygon.length < 3) return;
        let rCx = 0, rCz = 0;
        r.polygon.forEach(pt => {
          const px = getPtX(pt) - cx;
          const pz = getPtY(pt) - cz;
          rCx += px; rCz += pz;
        });
        rCx /= r.polygon.length;
        rCz /= r.polygon.length;

        const rName = String(r.name || r.label || '').toLowerCase();
        const isToiletOrPortico = rName.includes('toilet') || rName.includes('bath') || rName.includes('wc') || rName.includes('portico') || rName.includes('porch') || rName.includes('parking') || rName.includes('car');
        if (!isToiletOrPortico) {
          const fanMesh = buildCeilingFan();
          fanMesh.position.set(rCx, WALL_HEIGHT, rCz);
          fanMesh.userData = { sourceType: 'auto_ceiling_fan', sourceId: r.id };
          archGrp.add(fanMesh);
        }
      });

      // 5. EXPLICIT DETECTED FURNITURE & VEHICLES & ROOM-BASED FURNITURE GENERATION
      if (state.furn) {
        const spawnedRoomIds = new Set();

        // Helper to get room dimensions for any point (x, z)
        const getRoomForPoint = (px, pz) => {
          for (let r of (data.rooms || [])) {
            if (!r.polygon || r.polygon.length < 3) continue;
            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            const polyPts = r.polygon.map(pt => [(isCanonical ? pt.x : pt[0]) - cx, (isCanonical ? pt.y : pt[1]) - cz]);
            polyPts.forEach(p => {
              if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
              if (p[1] < minZ) minZ = p[1]; if (p[1] > maxZ) maxZ = p[1];
            });
            if (pointInPolygon([px, pz], polyPts)) {
              return { room: r, rw: maxX - minX, rd: maxZ - minZ };
            }
          }
          return { room: null, rw: 12.0, rd: 12.0 };
        };

        const spawnFurnitureItem = (f, parentRoomId = null) => {
          let fCx = 0, fCz = 0, fw = 6.0, fd = 6.0;

          if (f.polygon && f.polygon.length >= 3) {
            let fMinX = Infinity, fMaxX = -Infinity, fMinZ = Infinity, fMaxZ = -Infinity;
            f.polygon.forEach(p => {
              const p_x = isCanonical ? p.x : p[0];
              const p_z = isCanonical ? p.y : p[1];
              const px = p_x - cx, pz = p_z - cz;
              if (px < fMinX) fMinX = px; if (px > fMaxX) fMaxX = px;
              if (pz < fMinZ) fMinZ = pz; if (pz > fMaxZ) fMaxZ = pz;
            });
            fCx = (fMinX + fMaxX) / 2;
            fCz = (fMinZ + fMaxZ) / 2;
            fw = Math.max(1.0, fMaxX - fMinX);
            fd = Math.max(1.0, fMaxZ - fMinZ);
          } else if (f.position || f.x !== undefined) {
            const posX = f.position ? f.position.x : f.x;
            const posZ = f.position ? f.position.y : f.y;
            fCx = posX - cx;
            fCz = posZ - cz;
            fw = f.width_ft || f.width || 6.0;
            fd = f.height_ft || f.height || 6.0;
          } else {
            return;
          }

          const { rw, rd } = getRoomForPoint(fCx, fCz);
          const maxTargetW = Math.min(fw, rw * 0.48);
          const maxTargetD = Math.min(fd, rd * 0.48);

          let furnMesh = null;
          const type = String(f.type || f.name || f.label || '').toLowerCase();

          if (type.includes('bed')) {
            furnMesh = buildDoubleBed();
            const s = Math.min(maxTargetW / 9.2, maxTargetD / 6.8);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('sofa') || type.includes('couch') || type.includes('seating') || type.includes('living')) {
            furnMesh = buildLSectionalSofa();
            const s = Math.min(maxTargetW / 11.0, maxTargetD / 9.0);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('din') || type.includes('table')) {
            furnMesh = buildDiningSet();
            const s = Math.min(maxTargetW / 8.5, maxTargetD / 6.0);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('car') || type.includes('vehicle') || type.includes('auto') || type.includes('portico') || type.includes('parking')) {
            furnMesh = buildCar();
            if (fw > fd) furnMesh.rotation.y = Math.PI / 2;
            const s = Math.min(Math.min(rw, rd) * 0.6 / 6.5, Math.max(rw, rd) * 0.65 / 13.5);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('kitchen') || type.includes('counter')) {
            furnMesh = buildKitchenCounter();
            const s = Math.min(Math.max(rw, rd) * 0.48 / 8.7, Math.min(rw, rd) * 0.28 / 2.4);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('bath') || type.includes('toilet') || type.includes('wc')) {
            furnMesh = buildBathroomSet();
            const s = Math.min(Math.min(rw, rd) * 0.42 / 5.7, Math.min(rw, rd) * 0.42 / 5.7);
            furnMesh.scale.set(s, Math.max(0.7, s), s);
          } else if (type.includes('stair') || type.includes('step') || type.includes('duplex') || type.includes('up') || type.includes('dn') || type.includes('படிக்கட்')) {
            furnMesh = buildDogLeggedStaircase(fw, fd);
          } else {
            const box = new THREE.Mesh(new THREE.BoxGeometry(maxTargetW, 2.0, maxTargetD), getMat('furn_wood'));
            box.position.y = 1.0;
            furnMesh = new THREE.Group();
            furnMesh.add(box);
          }

          if (furnMesh) {
            furnMesh.position.set(fCx, 0, fCz);
            furnMesh.userData = { sourceType: f.type || (type.includes('stair') ? 'staircase' : 'furn'), sourceId: f.id };
            furnGrp.add(furnMesh);
            if (parentRoomId) spawnedRoomIds.add(parentRoomId);

            if (state.dbg) {
              const dbgSp = createTextSprite(f.id || type, '#8b5cf6');
              dbgSp.position.set(fCx, 3.5, fCz);
              dbgGrp.add(dbgSp);
            }
          }
        };

        // Collect all explicit furniture lists from top-level and target data (including stairs)
        const rawFurniture = [
          ...(data.furniture || []),
          ...(curData?.furniture || []),
          ...(curData?.model_data?.furniture || []),
          ...(data.model_data?.furniture || []),
          ...(data.floors?.ground?.furniture || []),
          ...(data.stairs || []),
          ...(curData?.stairs || []),
          ...(curData?.model_data?.stairs || []),
          ...(data.model_data?.stairs || []),
          ...(data.floors?.ground?.stairs || [])
        ];
        const rawVehicles = [
          ...(data.vehicles || []),
          ...(curData?.vehicles || []),
          ...(curData?.model_data?.vehicles || []),
          ...(data.model_data?.vehicles || []),
          ...(data.floors?.ground?.vehicles || [])
        ];

        const furnitureSeen = new Set();
        const itemsToSpawn = [];

        [...rawFurniture, ...rawVehicles].forEach(item => {
          if (!item) return;
          const itemId = item.id || item.source_id || JSON.stringify(item.position || item.polygon || Math.random());
          if (!furnitureSeen.has(itemId)) {
            furnitureSeen.add(itemId);
            itemsToSpawn.push(item);
          }
        });

        (data.rooms || []).forEach(r => {
          if (r.furniture && Array.isArray(r.furniture)) {
            r.furniture.forEach(item => {
              const itemId = item.id || item.source_id || JSON.stringify(item.position || Math.random());
              if (!furnitureSeen.has(itemId)) {
                furnitureSeen.add(itemId);
                itemsToSpawn.push(item);
                if (r.id) spawnedRoomIds.add(r.id);
              }
            });
          }
        });

        itemsToSpawn.forEach(item => spawnFurnitureItem(item));

        // Fallback: If 2D plan JSON rooms do NOT have explicit furniture objects detected,
        // automatically generate standard matching 3D furniture strictly inside each room present in the 2D plan!
        (data.rooms || []).forEach(r => {
          if (!r.polygon || r.polygon.length < 3) return;
          if (r.id && spawnedRoomIds.has(r.id)) return; // Skip if room already has explicit furniture

          const rName = String(r.name || r.label || '').toLowerCase();

          // Compute room centroid and bounding box
          let rMinX = Infinity, rMaxX = -Infinity, rMinZ = Infinity, rMaxZ = -Infinity;
          let rCx = 0, rCz = 0;
          r.polygon.forEach(pt => {
            const px = (isCanonical ? pt.x : pt[0]) - cx;
            const pz = (isCanonical ? pt.y : pt[1]) - cz;
            rCx += px; rCz += pz;
            if (px < rMinX) rMinX = px; if (px > rMaxX) rMaxX = px;
            if (pz < rMinZ) rMinZ = pz; if (pz > rMaxZ) rMaxZ = pz;
          });
          rCx /= r.polygon.length;
          rCz /= r.polygon.length;
          const rw = rMaxX - rMinX;
          const rd = rMaxZ - rMinZ;

          let autoMesh = null;

          if (rName.includes('bedroom') || rName.includes('bed room') || rName.includes('master bed') || rName.includes('bed')) {
            autoMesh = buildDoubleBed();
            const targetW = Math.min(5.2, rw * 0.45);
            const targetD = Math.min(5.8, rd * 0.50);
            const s = Math.min(targetW / 9.2, targetD / 6.8);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('living') || rName.includes('hall') || rName.includes('sitting')) {
            autoMesh = buildLSectionalSofa();
            const targetW = Math.min(7.0, rw * 0.50);
            const targetD = Math.min(5.5, rd * 0.50);
            const s = Math.min(targetW / 11.0, targetD / 9.0);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('dining') || rName.includes('dinning')) {
            autoMesh = buildDiningSet();
            const targetW = Math.min(5.0, rw * 0.45);
            const targetD = Math.min(4.2, rd * 0.45);
            const s = Math.min(targetW / 8.5, targetD / 6.0);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('kitchen')) {
            autoMesh = buildKitchenCounter();
            const targetLen = Math.min(5.5, Math.max(rw, rd) * 0.48);
            const targetDepth = Math.min(1.8, Math.min(rw, rd) * 0.28);
            const s = Math.min(targetLen / 8.7, targetDepth / 2.4);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('toilet') || rName.includes('bath') || rName.includes('wc')) {
            autoMesh = buildBathroomSet();
            const targetW = Math.min(3.0, rw * 0.40);
            const targetD = Math.min(3.0, rd * 0.40);
            const s = Math.min(targetW / 5.7, targetD / 5.7);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('portico') || rName.includes('porch') || rName.includes('parking') || rName.includes('car')) {
            autoMesh = buildCar();
            if (rw > rd) autoMesh.rotation.y = Math.PI / 2;
            const targetW = Math.min(5.5, Math.min(rw, rd) * 0.60);
            const targetD = Math.min(11.5, Math.max(rw, rd) * 0.65);
            const s = Math.min(targetW / 6.5, targetD / 13.5);
            if (s > 0.1) autoMesh.scale.set(s, Math.max(0.65, s), s);
          } else if (rName.includes('stair') || rName.includes('step') || rName.includes('duplex') || rName.includes('up') || rName.includes('dn') || rName.includes('படிக்கட்')) {
            autoMesh = buildDogLeggedStaircase(rw, rd);
          }

          if (autoMesh) {
            autoMesh.position.set(rCx, 0, rCz);
            const isStaircaseRoom = rName.includes('stair') || rName.includes('step') || rName.includes('duplex') || rName.includes('up') || rName.includes('dn') || rName.includes('படிக்கட்');
            autoMesh.userData = { sourceType: isStaircaseRoom ? 'auto_room_staircase' : 'auto_room_furn', sourceId: r.id };
            furnGrp.add(autoMesh);
          }
        });

        // Universal Fallback: If 2D plan JSON rooms didn't contain "staircase" label,
        // automatically generate a 3D U-Shaped staircase in the passage/hall/verandah area!
        let hasStaircase = false;
        furnGrp.children.forEach(child => {
          const type = String(child.userData?.sourceType || '').toLowerCase();
          if (type.includes('stair')) hasStaircase = true;
        });

        if (!hasStaircase && data.rooms && data.rooms.length > 0) {
          let bestStairRoom = null;
          let maxScore = -1;

          (data.rooms || []).forEach(r => {
            if (!r.polygon || r.polygon.length < 3) return;
            const rName = String(r.name || r.label || '').toLowerCase();
            const isToilet = rName.includes('toilet') || rName.includes('bath') || rName.includes('wc');
            const isBed = rName.includes('bedroom') || rName.includes('bed');
            const isKitchen = rName.includes('kitchen');
            const isPooja = rName.includes('pooja') || rName.includes('puja') || rName.includes('mandir');

            // STRICT: Never spawn a staircase in Bedroom, Toilet, Kitchen, or Pooja Room!
            if (isToilet || isBed || isKitchen || isPooja) return;

            let rMinX = Infinity, rMaxX = -Infinity, rMinZ = Infinity, rMaxZ = -Infinity;
            let rCx = 0, rCz = 0;
            r.polygon.forEach(pt => {
              const px = (isCanonical ? pt.x : pt[0]) - cx;
              const pz = (isCanonical ? pt.y : pt[1]) - cz;
              rCx += px; rCz += pz;
              if (px < rMinX) rMinX = px; if (px > rMaxX) rMaxX = px;
              if (pz < rMinZ) rMinZ = pz; if (pz > rMaxZ) rMaxZ = pz;
            });
            rCx /= r.polygon.length;
            rCz /= r.polygon.length;
            const rw = rMaxX - rMinX;
            const rd = rMaxZ - rMinZ;
            const area = rw * rd;

            let priority = 0;
            if (rName.includes('stair') || rName.includes('step') || rName.includes('duplex') || rName.includes('up') || rName.includes('dn') || rName.includes('படிக்கட்')) priority = 100;
            else if (rName.includes('passage') || rName.includes('corridor') || rName.includes('lobby') || rName.includes('verandah')) priority = 90;
            else if (rName.includes('portico') || rName.includes('porch')) priority = 80;
            else if (rName.includes('hall') || rName.includes('living')) priority = 70;
            else priority = 10;

            const aspect = Math.max(rw / Math.max(0.1, rd), rd / Math.max(0.1, rw));
            let aspectBonus = (aspect > 1.4 && aspect < 4.0 && area > 20) ? 300 : 0;

            const score = priority * 1000 + aspectBonus + area;
            if (score > maxScore) {
              maxScore = score;
              bestStairRoom = { r, rMinX, rMaxX, rMinZ, rMaxZ, rCx, rCz, rw, rd };
            }
          });

          if (bestStairRoom) {
            const { r, rMinX, rMaxX, rMinZ, rMaxZ, rCx, rCz, rw, rd } = bestStairRoom;
            const rName = String(r.name || r.label || '').toLowerCase();
            let stairMesh = buildDogLeggedStaircase(rw, rd);
            if (stairMesh) {
              let posX = rCx;
              let posZ = rCz;
              // If fallback is placed in Hall/Living Room, align it against a side wall so it doesn't block room center
              if (rName.includes('hall') || rName.includes('living')) {
                posX = (rw > rd) ? rMinX + rw * 0.25 : rMinX + rw * 0.3;
                posZ = (rw > rd) ? rMinZ + rd * 0.3 : rMinZ + rd * 0.25;
              }
              stairMesh.position.set(posX, 0, posZ);
              stairMesh.userData = { sourceType: 'auto_fallback_staircase', sourceId: 'fallback' };
              furnGrp.add(stairMesh);
            }
          }
        }
      }

      // Update Floor center for camera orbit
      if (maxX !== -Infinity) {
        floorCenter.set(0, WALL_HEIGHT / 2, 0);
        floorSize.set(maxX - minX, WALL_HEIGHT, maxZ - minZ);
      } else {
        const bb = new THREE.Box3().setFromObject(archGrp);
        bb.getCenter(floorCenter); bb.getSize(floorSize);
      }

      if (ld) ld.style.display = 'none';

      // Phase 2.6: Automated Geometry Validation
      await validateGeometry(data);
    }

    async function validateGeometry(data) {
      console.log("=== GEOMETRY VALIDATION REPORT ===");
      let errors = 0;

      // 1. Validate Walls
      const jsonWalls = data.walls || [];
      const meshWalls = archGrp.children.filter(c => c.userData?.sourceType === 'wall');
      console.log(`Walls: JSON = ${jsonWalls.length}, 3D Meshes = ${meshWalls.length}`);
      if (jsonWalls.length !== meshWalls.length) {
        console.error("Mismatch in wall count!");
        errors++;
      }

      // 2. Validate Openings
      const jsonOpenings = data.openings || [];
      const meshOpenings = archGrp.children.filter(c => c.userData?.sourceType === 'opening');
      console.log(`Openings: JSON = ${jsonOpenings.length}, 3D Meshes = ${meshOpenings.length}`);
      if (jsonOpenings.length !== meshOpenings.length) {
        console.error("Mismatch in opening count!");
        errors++;
      }

      // 3. Validate Rooms
      const jsonRooms = data.rooms || [];
      const meshRooms = archGrp.children.filter(c => c.userData?.sourceType === 'room');
      console.log(`Rooms: JSON = ${jsonRooms.length}, 3D Meshes = ${meshRooms.length}`);
      if (jsonRooms.length !== meshRooms.length) {
        console.error("Mismatch in room count!");
        errors++;
      }

      // 4. Opening Collision Validation
      console.log("--- OPENING COLLISION TEST ---");
      meshOpenings.forEach(opMesh => {
        const opBox = new THREE.Box3().setFromObject(opMesh);

        // Check if any solid wall intersects this opening's logical VOID space
        // The opening mesh is the lintel (Y=7 to 10). The void is Y=0 to 7.
        // We create a bounding box for the void:
        const voidBox = opBox.clone();
        voidBox.min.y = 0;
        voidBox.max.y = opBox.min.y - 0.05; // Up to just below the lintel

        // Shrink the void box slightly in X/Z to avoid precision issues at corners
        const center = new THREE.Vector3();
        voidBox.getCenter(center);
        voidBox.expandByScalar(-0.02);

        let collided = false;
        meshWalls.forEach(wallMesh => {
          const wallBox = new THREE.Box3().setFromObject(wallMesh);
          if (wallBox.intersectsBox(voidBox)) {
            collided = true;
            console.error(`FAIL: Solid wall (ID: ${wallMesh.userData.sourceId}) passes through opening void (ID: ${opMesh.userData.sourceId})!`);
            errors++;
          }
        });

        if (!collided) {
          console.log(`PASS: Opening (ID: ${opMesh.userData.sourceId}) has a true geometric void beneath it.`);
        }
      });

      if (errors === 0) {
        console.log("✅ All geometry successfully mapped from Canonical JSON to 3D Scene!");
        console.log("✅ Actual structural voids confirmed for all doors/windows!");
      } else {
        console.error(`❌ Validation failed with ${errors} errors.`);
      }

      // Phase 3.1: Geometry Lock Check
      const finalHash = await hashGeometry(data);
      if (finalHash !== currentGeometryHash) {
        console.error(`❌ FATAL: Geometry Lock broken! Hash changed from ${currentGeometryHash} to ${finalHash}`);
        alert("FATAL ERROR: Visual rendering mutated architectural geometry.");
      } else {
        console.log("🔒 Geometry Hash MATCH! Architecture preserved.");
      }

      console.log("==================================");
    }

    // ─── CAMERA & UI CONTROLS (Phase 3.5) ──────────────────────────────────
    let isCeilVisible = false;
    window.toggleCeiling = function (forceState = null) {
      isCeilVisible = forceState !== null ? forceState : !isCeilVisible;
      if (ceilGrp) ceilGrp.visible = isCeilVisible;
      const btnCeil = document.getElementById('btn-ceil');
      if (btnCeil) btnCeil.innerText = `CEILING: ${isCeilVisible ? 'ON' : 'OFF'}`;
    };

    window.setCamMode = function (mode) {
      if (mode === 'top') {
        const maxDim = Math.max(floorSize.x || 35, floorSize.z || 35);
        const dist = Math.max(75, maxDim * 2.2);
        controls.enabled = false;
        camera.position.set(0, dist, 0);
        camera.up.set(0, 0, -1);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
        window.toggleCeiling(false);
      } else if (mode === 'iso') {
        controls.enabled = true;
        camera.position.set(70, 70, 70);
        camera.up.set(0, 1, 0);
        controls.target.set(0, 0, 0);
        controls.enableRotate = true;
        controls.maxPolarAngle = Math.PI / 3;
        window.toggleCeiling(false);
        controls.update();
      } else if (mode === 'orbit') {
        controls.enabled = true;
        camera.position.set(0, 5, 20);
        camera.up.set(0, 1, 0);
        controls.target.set(0, 5, 0);
        controls.enableRotate = true;
        controls.maxPolarAngle = Math.PI / 1.8;
        window.toggleCeiling(false);
        controls.update();
      }
    };

    function resetCamera() {
      setCamMode('iso');
    }

    // ─── PUBLIC CONTROLLER APIS ────────────────────────────────────────────
    window.renderProject = async function (data) {
      curData = data;
      let targetData = data;
      if (data.floors && data.floors.ground) targetData = data.floors.ground;
      else if (data.floors && data.floors.first) targetData = data.floors.first;

      await rebuildAll(targetData);
      resetCamera();
    };

    window.setView = async function (viewName) {
      if (!curData) return;
      if (curData.floors && curData.floors[viewName]) {
        await rebuildAll(curData.floors[viewName]);
      } else {
        await rebuildAll(curData);
      }
      resetCamera();
    };

    window.setDoorStyle = function (style) {
      state.doorStyle = style;
      if (curData) {
        let targetData = curData;
        if (curData.floors && curData.floors.ground) targetData = curData.floors.ground;
        rebuildAll(targetData);
      }
    };

    window.setWindowStyle = function (style) {
      state.windowStyle = style;
      if (curData) {
        let targetData = curData;
        if (curData.floors && curData.floors.ground) targetData = curData.floors.ground;
        rebuildAll(targetData);
      }
    };

    window.captureScreenshot = function (mode) {
      const targetMode = mode || 'top';
      const oldPos = camera.position.clone();
      const oldUp = camera.up.clone();
      const oldTarget = controls.target.clone();
      const oldControlsEnabled = controls.enabled;

      if (targetMode === 'top' || targetMode === 'pdf_top') {
        const maxDim = Math.max(floorSize.x || 35, floorSize.z || 35);
        const dist = Math.max(75, maxDim * 2.5);
        controls.enabled = false;
        camera.position.set(0, dist, 0);
        camera.up.set(0, 0, -1);
        camera.lookAt(0, 0, 0);
        if (ceilGrp) ceilGrp.visible = false;
      }

      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');

      // Restore user's interactive camera position
      controls.enabled = oldControlsEnabled;
      camera.position.copy(oldPos);
      camera.up.copy(oldUp);
      controls.target.copy(oldTarget);
      if (controls.enabled) controls.update();
      renderer.render(scene, camera);

      return dataUrl;
    };

    window.setFurnitureVisible = function (visible) {
      state.furn = visible;
      updateVisibility();
    };

    window.addEventListener('message', e => {
      let d = e.data;
      if (typeof d === 'string' && d.startsWith('{')) try { d = JSON.parse(d); } catch (x) { return; }
      if (d?.type === 'render' && d.data) window.renderProject(d.data);
      if (d?.type === 'set_view' && d.view) window.setView(d.view);
      if (d?.type === 'set_cam_mode' && d.mode) window.setCamMode(d.mode);
      if (d?.type === 'set_door_style' && d.style) window.setDoorStyle(d.style);
      if (d?.type === 'set_window_style' && d.style) window.setWindowStyle(d.style);
      if (d?.type === 'set_furniture_visible') window.setFurnitureVisible(d.visible);
      if (d?.type === 'capture_screenshot') {
        const dataUrl = window.captureScreenshot(d.mode || 'top');
        window.parent.postMessage(JSON.stringify({ type: 'screenshot_result', data: dataUrl }), '*');
      }
    });

    init();
    window.parent.postMessage('viewer_ready', '*');
  </script>
</body>
