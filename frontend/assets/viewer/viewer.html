<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanavu Illam 3D Architectural Renderer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8fa0b2;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #v {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* UI Control Panel */
    #ui-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 18px;
      border-radius: 12px;
      z-index: 100;
      font-size: 13px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      min-width: 170px;
    }

    .ui-title {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }

    .ui-row {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .ui-row input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: #38bdf8;
      border-radius: 4px;
    }

    /* Loading overlay */
    #ld {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8fa0b2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      font-weight: 600;
      color: #1e293b;
      gap: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(30, 41, 59, 0.2);
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Bottom toolbar */
    .tb {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .tb button {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: all .2s ease;
    }

    .tb button:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
  </style>
  <script
    type="importmap">{"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}</script>
</head>

<body>
  <div id="ld">
    <div class="spinner"></div>
    <div id="ld-txt">GENERATING PROFESSIONAL 3D FLOOR PLAN...</div>
  </div>
  <div id="v"></div>

  <script>
    window.addEventListener('error', function (e) {
      const ldTxt = document.getElementById('ld-txt');
      if (ldTxt) ldTxt.innerHTML = '<span style="color:red; font-size: 14px;">Error: ' + e.message + '<br>' + e.filename + ':' + e.lineno + '</span>';
    });
    window.addEventListener('unhandledrejection', function (e) {
      const ldTxt = document.getElementById('ld-txt');
      if (ldTxt) ldTxt.innerHTML = '<span style="color:red; font-size: 14px;">Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</span>';
    });
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let archGrp, furnGrp, envGrp, dbgGrp, ceilGrp;
    let curData = null;
    let floorCenter = new THREE.Vector3();
    let floorSize = new THREE.Vector3();

    const state = {
      arch: true, furn: false, mat: true, light: true, dbg: false,
      doorStyle: 'glass', windowStyle: 'wood'
    };

    const texLoader = new THREE.TextureLoader();
    const texDoorGlass = texLoader.load('door_glass.jpg');
    const texDoorTeak = texLoader.load('door_teak.jpg');
    const texDoorPanel = texLoader.load('door_panel.jpg');
    const texWindowWood = texLoader.load('window_wood.jpg');
    const texWindowUPVC = texLoader.load('window_upvc.jpg');
    const texWindowBlack = texLoader.load('window_black.jpg');

    // ─── PROCEDURAL TEXTURE GENERATORS ────────────────────────────────────
    function createWoodTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#c58b4e';
      ctx.fillRect(0, 0, 512, 512);

      const plankHeight = 32;
      for (let y = 0; y < 512; y += plankHeight) {
        ctx.fillStyle = 'rgba(70, 40, 10, 0.25)';
        ctx.fillRect(0, y, 512, 2);

        const offset = (y / plankHeight % 2) * 160;
        for (let x = offset; x < 512; x += 320) {
          ctx.fillRect(x, y, 2, plankHeight);
        }
      }

      for (let i = 0; i < 15000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 235, 200, 0.08)' : 'rgba(80, 45, 15, 0.06)';
        const gx = Math.random() * 512;
        const gy = Math.random() * 512;
        ctx.fillRect(gx, gy, Math.random() * 12 + 2, 1);
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createDoorGlassTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#2A1208';
      ctx.fillRect(0, 0, 512, 1024);
      for (let i = 0; i < 1000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(75, 35, 15, 0.3)' : 'rgba(15, 5, 2, 0.25)';
        ctx.fillRect(Math.random() * 512, Math.random() * 1024, Math.random() * 4 + 1, Math.random() * 100 + 20);
      }
      ctx.strokeStyle = '#150602'; ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, 492, 1004);
      ctx.fillStyle = '#CBE3F7';
      ctx.fillRect(280, 80, 160, 864);
      ctx.strokeStyle = '#0F0603'; ctx.lineWidth = 8;
      ctx.strokeRect(280, 80, 160, 864);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(455, 420, 16, 260);

      const tex = new THREE.CanvasTexture(cv);
      return tex;
    }

    function createDoorTeakTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(0, 0, 512, 1024);
      for (let i = 0; i < 1400; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(160, 90, 35, 0.35)' : 'rgba(60, 25, 5, 0.28)';
        ctx.fillRect(Math.random() * 512, Math.random() * 1024, Math.random() * 5 + 1, Math.random() * 120 + 30);
      }
      ctx.fillStyle = 'rgba(30, 10, 2, 0.45)';
      for (let x = 64; x < 512; x += 64) {
        ctx.fillRect(x, 0, 4, 1024);
      }
      const tex = new THREE.CanvasTexture(cv);
      return tex;
    }

    function createDoorPanelTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#3B1A0E';
      ctx.fillRect(0, 0, 512, 1024);
      const panels = [
        [40, 60, 190, 400], [280, 60, 190, 400],
        [40, 520, 190, 440], [280, 520, 190, 440]
      ];
      panels.forEach(([px, py, pw, ph]) => {
        ctx.fillStyle = '#4A2214';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#1C0B05'; ctx.lineWidth = 10;
        ctx.strokeRect(px, py, pw, ph);
      });
      const tex = new THREE.CanvasTexture(cv);
      return tex;
    }

    function createWindowWoodTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#6e4624';
      ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 600; i++) {
        ctx.fillStyle = 'rgba(50, 25, 10, 0.25)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 6 + 1, Math.random() * 60 + 10);
      }
      const tex = new THREE.CanvasTexture(cv);
      return tex;
    }

    function createTileTexture(colorHex, lineHex, tileSize = 64) {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = lineHex;
      ctx.lineWidth = 2;
      for (let x = 0; x <= 512; x += tileSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += tileSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function createPlasterTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fafafa';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 4000; i++) {
        ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.03})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function createGraniteTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 3000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createChevronParquetTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');

      // Base Honey Teak Wood Background
      ctx.fillStyle = '#c68436';
      ctx.fillRect(0, 0, 512, 512);

      // Fine Wood Grain Texture
      for (let i = 0; i < 2000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(140, 75, 20, 0.25)' : 'rgba(230, 165, 80, 0.3)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 4 + 1, Math.random() * 50 + 10);
      }

      // Chevron V-Pattern Planks & Dark Plank Joints
      ctx.strokeStyle = '#4a2408';
      ctx.lineWidth = 3;

      const numColumns = 4;
      const colWidth = 512 / numColumns;
      const vHeight = 64;

      for (let y = -512; y <= 1024; y += vHeight) {
        for (let col = 0; col < numColumns; col++) {
          const xLeft = col * colWidth;
          const xMid = xLeft + colWidth / 2;
          const xRight = xLeft + colWidth;

          // Draw Chevron V shape seam
          ctx.beginPath();
          ctx.moveTo(xLeft, y);
          ctx.lineTo(xMid, y + vHeight / 2);
          ctx.lineTo(xRight, y);
          ctx.stroke();

          // Fill alternating planks with subtle tone variation for realistic wood parquet depth
          ctx.fillStyle = (col + Math.floor(y / vHeight)) % 2 === 0
            ? 'rgba(255, 200, 120, 0.12)'
            : 'rgba(60, 25, 5, 0.12)';
          ctx.beginPath();
          ctx.moveTo(xLeft, y);
          ctx.lineTo(xMid, y + vHeight / 2);
          ctx.lineTo(xRight, y);
          ctx.lineTo(xRight, y + vHeight);
          ctx.lineTo(xMid, y + vHeight / 2 + vHeight);
          ctx.lineTo(xLeft, y + vHeight);
          ctx.closePath();
          ctx.fill();
        }
      }

      // Vertical Column Joint Seams
      for (let col = 0; col <= numColumns; col++) {
        ctx.strokeStyle = '#381803';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(col * colWidth, 0);
        ctx.lineTo(col * colWidth, 512);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      return tex;
    }

    const texWood = createWoodTexture();
    const texProcDoorGlass = createDoorGlassTexture();
    const texProcDoorTeak = createDoorTeakTexture();
    const texProcDoorPanel = createDoorPanelTexture();
    const texProcWindowWood = createWindowWoodTexture();
    const texChevronParquet = createChevronParquetTexture();
    const texLightTile = createTileTexture('#f8fafc', '#cbd5e1', 64);
    const texSlateTile = createTileTexture('#475569', '#334155', 64);
    const texPlaster = createPlasterTexture();
    const texGranite = createGraniteTexture();

    // ─── MATERIALS SYSTEM ──────────────────────────────────────────────────
    function getMat(type, label = '') {
      if (!state.mat) {
        return new THREE.MeshBasicMaterial({ color: type === 'glass' ? 0x88ccff : 0xdddddd });
      }

      const lbl = (label || '').toLowerCase();

      if (type === 'wall') return new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.05 });
      if (type === 'door') {
        let doorTex = texProcDoorGlass;
        if (state.doorStyle === 'panel') doorTex = texProcDoorPanel;
        if (state.doorStyle === 'teak') doorTex = texProcDoorTeak;
        return new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.35, metalness: 0.1 });
      }
      if (type === 'wood_frame') return new THREE.MeshStandardMaterial({ map: texProcWindowWood, color: 0x6e4624, roughness: 0.45 });
      if (type === 'upvc_frame') return new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.05 });
      if (type === 'black_frame') return new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });
      if (type === 'black_handle') return new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.25, metalness: 0.85 });
      if (type === 'brass') return new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.2, metalness: 0.85 });
      if (type === 'steel') return new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.9 });
      if (type === 'glass') return new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transmission: 0.92, opacity: 0.85, transparent: true, roughness: 0.05, ior: 1.52, reflectivity: 0.6 });
      if (type === 'frosted_glass') return new THREE.MeshPhysicalMaterial({ color: 0xe0f2fe, transmission: 0.85, opacity: 0.8, transparent: true, roughness: 0.35, reflectivity: 0.5 });
      if (type === 'mesh') return new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9, transparent: true, opacity: 0.6 });
      if (type === 'frame') return new THREE.MeshStandardMaterial({ map: texWood, color: 0x5c3a1e, roughness: 0.4 });

      if (type === 'floor') {
        // Universal Option 1: Chevron Honey Teak Wooden Parquet Tiles for ALL rooms and spaces
        return new THREE.MeshStandardMaterial({ map: texChevronParquet, roughness: 0.35, metalness: 0.05 });
      }

      if (type === 'stair') return new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.6 });

      if (type === 'sofa_red') return new THREE.MeshStandardMaterial({ color: 0xd92626, roughness: 0.85 });
      if (type === 'cushion_cream') return new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.9 });
      if (type === 'rug_cream') return new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.95 });
      if (type === 'furn_wood') return new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.5 });
      if (type === 'furn_dark_wood') return new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.6 });
      if (type === 'bed_sheet') return new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9 });
      if (type === 'bed_blanket') return new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });
      if (type === 'pillow') return new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
      if (type === 'granite') return new THREE.MeshStandardMaterial({ map: texGranite, roughness: 0.2, metalness: 0.1 });
      if (type === 'ceramic') return new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.05 });
      if (type === 'plant_leaf') return new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6 });
      if (type === 'chrome') return new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.1, metalness: 0.9 });

      return new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
    }

    // ─── INITIALIZATION ────────────────────────────────────────────────────
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8fa0b2);

      camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 2000);
      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      document.getElementById('v').appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05;

      archGrp = new THREE.Group(); scene.add(archGrp);
      furnGrp = new THREE.Group(); scene.add(furnGrp);
      envGrp = new THREE.Group(); scene.add(envGrp);
      dbgGrp = new THREE.Group(); scene.add(dbgGrp);
      ceilGrp = new THREE.Group(); ceilGrp.visible = false; scene.add(ceilGrp);

      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      renderer.setAnimationLoop(() => {
        controls.update();
        if (animatedFans && animatedFans.length > 0) {
          animatedFans.forEach(fan => {
            if (fan) fan.rotation.y += 0.22;
          });
        }
        renderer.render(scene, camera);
      });
    }

    function setupUI() {
      // UI removed
    }

    function updateVisibility() {
      archGrp.visible = state.arch;
      furnGrp.visible = state.furn;
      dbgGrp.visible = state.dbg;

      envGrp.visible = state.light;
      scene.background = state.light ? new THREE.Color(0x8fa0b2) : new THREE.Color(0x1e293b);

      if (curData) rebuildAll(curData);
    }

    window.resetCamera = () => {
      if (!floorSize.x) return;
      const maxDim = Math.max(floorSize.x, floorSize.z);
      camera.position.set(
        floorCenter.x + maxDim * 0.48,
        maxDim * 0.58 + 4,
        floorCenter.z + maxDim * 0.48
      );
      controls.target.copy(floorCenter);
    };

    window.fitToPlan = () => {
      if (!floorSize.x) return;
      const maxDim = Math.max(floorSize.x, floorSize.z);
      camera.position.set(floorCenter.x, maxDim * 1.1 + 5, floorCenter.z + 0.1);
      controls.target.copy(floorCenter);
    };

    // ─── GEOMETRY UTILS ────────────────────────────────────────────────────
    function createTextSprite(text, color) {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 64;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = color;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 42);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
      sp.scale.set(5, 1.25, 1);
      return sp;
    }

    function pointInPolygon(pt, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        const intersect = ((yi > pt[1]) != (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // ─── FURNITURE BUILDERS ───────────────────────────────────────────────
    function buildDoubleBed() {
      const grp = new THREE.Group();
      const frame = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.8, 6.8), getMat('furn_dark_wood'));
      frame.position.y = 0.4; frame.castShadow = true; frame.receiveShadow = true;
      grp.add(frame);

      const hb = new THREE.Mesh(new THREE.BoxGeometry(6.4, 3.2, 0.5), getMat('furn_dark_wood'));
      hb.position.set(0, 1.6, -3.2); hb.castShadow = true;
      grp.add(hb);

      const mat = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.9, 6.2), getMat('bed_sheet'));
      mat.position.set(0, 1.15, 0.1); mat.castShadow = true; mat.receiveShadow = true;
      grp.add(mat);

      const blk = new THREE.Mesh(new THREE.BoxGeometry(5.82, 0.2, 4.0), getMat('bed_blanket'));
      blk.position.set(0, 1.62, 1.1); blk.castShadow = true;
      grp.add(blk);

      const p1 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.25, 1.4), getMat('pillow'));
      p1.position.set(-1.5, 1.65, -2.1); p1.rotation.x = 0.1; p1.castShadow = true;
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.25, 1.4), getMat('pillow'));
      p2.position.set(1.5, 1.65, -2.1); p2.rotation.x = 0.1; p2.castShadow = true;

    function buildDogLeggedStaircase(rw = 8, rd = 12) {
      const grp = new THREE.Group();
      const isHorizontal = rw > rd;
      const roomW = isHorizontal ? rd : rw;
      const roomD = isHorizontal ? rw : rd;

      // Strict scaling: Staircase footprint fits comfortably inside room bounds (max 85% of dimensions)
      const effW = Math.min(Math.max(2.8, roomW * 0.85), 6.0);
      const effD = Math.min(Math.max(5.0, roomD * 0.85), 10.5);

      const numSteps = 7;
      const stepH = 5.0 / numSteps;
      const stepD = (effD * 0.40) / numSteps;
      const stepW = effW * 0.44;

      // Marble steps & White risers matching user sample 3D layout
      const matTread = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.25, metalness: 0.05 });
      const matRiser = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
      const matRail = getMat('steel') || new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });

      // Flight 1 (ascending on left)
      const leftX = -effW / 2 + stepW / 2;
      for (let i = 0; i < numSteps; i++) {
        const tr = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.2, stepD), matTread);
        tr.position.set(leftX, i * stepH + 0.1, -effD * 0.25 + i * stepD);
        tr.castShadow = true; tr.receiveShadow = true;
        const rs = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, 0.1), matRiser);
        rs.position.set(leftX, i * stepH + stepH / 2, -effD * 0.25 + i * stepD - stepD / 2);
        grp.add(tr, rs);
      }

      // Mid-Landing Platform
      const landing = new THREE.Mesh(new THREE.BoxGeometry(effW * 0.95, 0.3, effD * 0.25), matTread);
      landing.position.set(0, 5.0, effD * 0.30);
      landing.castShadow = true; landing.receiveShadow = true;
      grp.add(landing);

      // Flight 2 (ascending on right in reverse)
      const rightX = effW / 2 - stepW / 2;
      for (let i = 0; i < numSteps; i++) {
        const tr = new THREE.Mesh(new THREE.BoxGeometry(stepW, 0.2, stepD), matTread);
        tr.position.set(rightX, 5.0 + i * stepH + 0.1, effD * 0.18 - i * stepD);
        tr.castShadow = true; tr.receiveShadow = true;
        const rs = new THREE.Mesh(new THREE.BoxGeometry(stepW, stepH, 0.1), matRiser);
        rs.position.set(rightX, 5.0 + i * stepH + stepH / 2, effD * 0.18 - i * stepD + stepD / 2);
        grp.add(tr, rs);
      }

      // Stainless Steel Railings with Vertical Balusters (as in sample image)
      const railTop = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, effD * 0.75), matRail);
      railTop.position.set(0, 3.2, 0);
      grp.add(railTop);

      for (let k = -2; k <= 2; k++) {
        const baluster = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 3.2), matRail);
        baluster.position.set(0, 3.2, k * (effD * 0.15));
        grp.add(baluster);
      }

      if (isHorizontal) {
        grp.rotation.y = Math.PI / 2;
      }

      return grp;
    }
