<!DOCTYPE html><html class="h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Syne:wght@500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F4F4F4;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#F4F4F4] text-[#0A0A0A] font-['Inter'] antialiased h-screen w-screen overflow-hidden flex flex-col justify-center items-center">
<main class="w-[390px] h-[844px] max-w-full max-h-full bg-[#F4F4F4] flex flex-col justify-between px-5 pt-8 pb-10 relative overflow-hidden select-none">
<!-- TOP BRAND HERO -->
<div class="relative w-full flex flex-col items-center pt-2"><div class="w-24 h-24 flex items-center justify-center"><svg fill="none" height="96" viewBox="0 0 34 34" width="96" xmlns="http://www.w3.org/2000/svg"><path d="M17 4L4 14.5V28.5C4 29.3284 4.67157 30 5.5 30H28.5C29.3284 30 30 29.3284 30 28.5V14.5L17 4Z" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path><text fill="#0A0A0A" font-family="'Syne', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em" text-anchor="middle" x="17" y="23.5">KI</text></svg></div><h1 class="text-[34px] leading-tight font-[500] text-[#0A0A0A] text-center tracking-[-0.01em] mt-2" style="font-family: Syne, sans-serif;">Kanavu Illam</h1></div>
<!-- CENTER ARCHITECTURAL 3D CARD -->
<div class="w-full flex items-center justify-center my-auto">
<div class="relative w-full h-[260px] rounded-[28px] bg-[#FFFFFF] shadow-[0_8px_24px_rgba(10,10,10,0.06)] flex items-center justify-center p-3 overflow-hidden">
<!-- Faint grid pattern underlay -->
<div class="absolute inset-0 opacity-[0.035] bg-[radial-gradient(#0A0A0A_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>
<!-- 3D Architectural Villa Render Image -->
<img alt="Architectural villa render" class="w-full h-full object-contain object-center z-10" src="https://lh3.googleusercontent.com/aida/AEtjO1U4dme8d1LPK7s4Yav-Viq55cHjDbJnaR-NnR0yiX0Cz3Qedd3UsPqrnaP_MM8mXjJebj3AjstvloDN1LL33jcLzQ9KIie1S0Mie9IVW6PZZnBELw24r7tKfBwAqf74aQz56VO7TsfXn372VvzfmEwWE49FEDhIuYIa2uw89CFOApmFFU-iv4jGLavGJLkQ5Jj8kntINOZmymiVz18BBAxoVOgM_1xKNFx80kDTT4pW-ner3kplkEXFrqE">
<!-- Blueprint Corner Crosshair Accents -->
<div class="absolute top-4 left-4 w-2.5 h-2.5 border-t border-l border-[#DADADA] pointer-events-none"></div>
<div class="absolute top-4 right-4 w-2.5 h-2.5 border-t border-r border-[#DADADA] pointer-events-none"></div>
<div class="absolute bottom-4 left-4 w-2.5 h-2.5 border-b border-l border-[#DADADA] pointer-events-none"></div>
<div class="absolute bottom-4 right-4 w-2.5 h-2.5 border-b border-r border-[#DADADA] pointer-events-none"></div>
<!-- Corner Micro Badge -->
<div class="absolute bottom-3 right-4 z-20 px-2.5 py-1 rounded-full bg-[#EAEAEA] text-[#6B6B6B] text-[12px] font-[600] tracking-wider uppercase flex items-center gap-1.5 leading-none">
<span class="w-1.5 h-1.5 rounded-full bg-[#0A0A0A] inline-block"></span>
          SCALE 1:100
        </div>
</div>
</div>
<!-- BOTTOM ACTIONS -->
<div class="w-full flex flex-col gap-3">
<!-- Primary Pill Button -->
<button class="w-full h-[52px] rounded-full bg-[#0A0A0A] flex items-center justify-between px-5 transition-transform active:scale-[0.98] cursor-pointer shadow-sm border-0" type="button">
<span class="w-8"></span>
<span class="text-[14px] font-[600] text-[#FFFFFF] tracking-normal">Get started</span>
<div class="w-8 h-8 rounded-full bg-[#FFFFFF] flex items-center justify-center"><span class="material-symbols-outlined text-[18px] text-[#0A0A0A] font-bold">arrow_forward</span></div>
</button>
<!-- Outline Pill Button -->
<button class="w-full h-[52px] rounded-full bg-transparent border border-[#DADADA] flex items-center justify-center text-[14px] font-[600] text-[#0A0A0A] transition-transform active:scale-[0.98] cursor-pointer" type="button">
        Sign in
      </button>
</div>
</main>




</body></html>
