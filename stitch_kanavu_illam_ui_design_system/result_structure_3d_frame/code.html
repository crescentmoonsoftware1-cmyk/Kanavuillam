<script>
  (function() {
    const stage = document.getElementById('isometric-stage');
    const svg = document.getElementById('isometric-frame');
    if (!stage || !svg) return;

    let isPointerDown = false;
    let startX = 0;
    let currentRotation = 0;

    stage.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      startX = e.clientX;
      stage.setPointerCapture(e.pointerId);
      svg.classList.remove('transition-transform');
    });

    stage.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const deltaX = e.clientX - startX;
      startX = e.clientX;
      currentRotation += deltaX * 0.45;
      svg.style.transform = `rotateY(${currentRotation}deg)`;
    });

    const stopInteraction = (e) => {
      if (!isPointerDown) return;
      isPointerDown = false;
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
      svg.classList.add('transition-transform');
      currentRotation = Math.round(currentRotation / 15) * 15;
      svg.style.transform = `rotateY(${currentRotation}deg)`;
    };

    stage.addEventListener('pointerup', stopInteraction);
    stage.addEventListener('pointercancel', stopInteraction);
  })();
</script></main>
