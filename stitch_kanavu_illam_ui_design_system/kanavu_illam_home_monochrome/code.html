      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes entranceNav {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.94);

      70% {
        transform: translateY(-2px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    .anim-entrance-logo {
      animation: entranceLogo 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;

    .anim-entrance-carousel {

      animation: entranceNav 0.75s cubic-bezier(0.34, 1.4, 0.64, 1) 0.4s both;
    }

    /* Architectural House Isometric Levitation Float */
    @keyframes isometricFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.01);
      }
    }
    .anim-house-float {
      animation: isometricFloat 6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* Laser Blueprint Scan Shimmer across plan */
    @keyframes laserScan {
      0% {
        transform: translateY(100%) rotate(-12deg);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      50% {
        opacity: 0.95;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-120%) rotate(-12deg);
        opacity: 0;
      }
    }
    .anim-laser-beam {
      animation: laserScan 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Ambient Blueprint Compass Soft Breathing Pulse */
    @keyframes compassPulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);

      animation: compassPulse 9s ease-in-out infinite;

<script>
  (function () {
    const totalCards = 4;
    let currentIdx = 0;
    let timer = null;
    const cards = [
      document.getElementById('card-0'),
      document.getElementById('card-1'),
      document.getElementById('card-2'),
      document.getElementById('card-3')
    ];
    const dots = [
      document.getElementById('dot-0'),
      document.getElementById('dot-1'),
      document.getElementById('dot-2'),
      document.getElementById('dot-3')
    ];

    window.updateCarousel = function(nextIdx) {
      currentIdx = (nextIdx + totalCards) % totalCards;

      cards.forEach((card, i) => {
        let diff = (i - currentIdx + totalCards) % totalCards;
        // Normalize distance: active is 0, right is +1, left is -1 (or 3)
        if (diff === 0) {
          // Centered active card
          card.style.transform = 'translateX(0px) scale(1)';
          card.style.opacity = '1';
          card.style.zIndex = '20';
          card.style.pointerEvents = 'auto';
        } else if (diff === 1) {
          // Peeking Right
          card.style.transform = 'translateX(284px) scale(0.94)';
          card.style.opacity = '0.55';
          card.style.zIndex = '10';
          card.style.pointerEvents = 'auto';
        } else if (diff === totalCards - 1) {
          // Peeking Left
          card.style.transform = 'translateX(-284px) scale(0.94)';
          card.style.opacity = '0.55';
          card.style.zIndex = '10';
          card.style.pointerEvents = 'auto';
        } else {
          // Hidden back
          card.style.transform = 'translateX(500px) scale(0.9)';
          card.style.opacity = '0';
          card.style.zIndex = '0';
          card.style.pointerEvents = 'none';
        }
      });

      // Update Pagination Dots with active expansion
      dots.forEach((dot, i) => {
        if (i === currentIdx) {
          dot.style.width = '24px';
          dot.style.backgroundColor = '#0A0A0A';
        } else {
          dot.style.width = '8px';
          dot.style.backgroundColor = '#DADADA';
        }
      });
    };

    window.handleCardClick = function(index) {
      if (index === currentIdx) {
        // Active card tapped: subtle micro-bounce feedback
        const activeCard = cards[index];
        activeCard.style.transform = 'translateX(0px) scale(0.97)';
        setTimeout(() => {
          activeCard.style.transform = 'translateX(0px) scale(1)';
        }, 150);
      } else {
        updateCarousel(index);
        startAutoAdvance();
      }
    };

    function startAutoAdvance() {
      stopAutoAdvance();
      timer = setInterval(() => {
        updateCarousel(currentIdx + 1);
      }, 5500);
    }

    function stopAutoAdvance() {
      if (timer) clearInterval(timer);
    }

    // Touch / Swipe handler for mobile delight
    let touchStartX = 0;
    let touchEndX = 0;
    const track = document.getElementById('trainTrack');

    if (track) {
      track.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        stopAutoAdvance();
      }, { passive: true });

      track.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 40) {
          updateCarousel(currentIdx + 1);
        } else if (touchEndX - touchStartX > 40) {
          updateCarousel(currentIdx - 1);
        }
        startAutoAdvance();
      }, { passive: true });
    }

    // Bottom Navigation Dynamic Tab Switcher
    window.switchNavTab = function(index, el) {
      const indicator = document.getElementById('navIndicator');
      const tabs = document.querySelectorAll('.nav-tab');
      
      // Calculate offset based on tab width (84px) + margin
      if (indicator) {
        indicator.style.left = (6 + index * 92) + 'px';
      }

      tabs.forEach((tab, i) => {
        const icon = tab.querySelector('.material-symbols-outlined');
        const text = tab.querySelector('span:nth-child(2)');
        if (i === index) {
          icon.style.color = '#0A0A0A';
          if (i === 0) icon.style.fontVariationSettings = "'FILL' 1";
          text.style.color = '#0A0A0A';
          text.classList.remove('font-medium');
          text.classList.add('font-semibold');
          // Icon micro bounce
          icon.style.transform = 'scale(1.15)';
          setTimeout(() => { icon.style.transform = 'scale(1)'; }, 200);
        } else {
          icon.style.color = '#6B6B6B';
          icon.style.fontVariationSettings = "'FILL' 0";
          text.style.color = '#6B6B6B';
          text.classList.remove('font-semibold');
          text.classList.add('font-medium');
          icon.style.transform = 'scale(1)';
        }
      });
    };

    // Upload plan celebration feedback
    window.triggerUploadCelebration = function() {
      const heroContainer = document.getElementById('heroUploadCardContainer');
      if (heroContainer) {
        heroContainer.classList.add('scale-[1.02]');
        setTimeout(() => {
          heroContainer.classList.remove('scale-[1.02]');
        }, 300);
      }
    };

    // Initialize
    updateCarousel(0);
    startAutoAdvance();
  })();
</script></main>
