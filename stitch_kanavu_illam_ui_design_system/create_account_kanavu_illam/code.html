<!DOCTYPE html><html class="h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Create Account - Kanavu Illam</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#0A0A0A',
            muted: '#6B6B6B',
            borderLine: '#DADADA',
            pageBg: '#F4F4F4',
            softFill: '#EAEAEA'
          },
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
<style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F4F4F4;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="w-full h-full bg-[#F4F4F4] text-[#0A0A0A] flex flex-col justify-between items-center py-6 px-5 select-none overflow-hidden max-w-[390px] mx-auto min-h-[844px]">
<!-- BRAND HEADER -->
<header class="flex flex-col items-center justify-center mt-2 flex-shrink-0"><svg class="w-[56px] h-auto text-[#0A0A0A] mb-2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5v9.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"></path><text class="font-syne" fill="#0A0A0A" stroke="none" style="font-size: 7px; font-weight: 700; letter-spacing: -0.5px;" x="7.5" y="16.5">KI</text></svg><span class="font-syne font-medium text-[24px] text-[#0A0A0A] tracking-tight">Kanavu Illam</span></header>
<!-- MAIN ELEVATED WHITE CARD -->
<main class="w-full bg-white rounded-[28px] p-[22px] shadow-[0_8px_24px_rgba(10,10,10,0.06)] flex flex-col flex-shrink-0 my-auto">
<!-- Card Header -->
<div class="mb-4">
<h1 class="font-syne font-medium text-[22px] text-[#0A0A0A] tracking-tight leading-tight">Create account</h1>

</div>
<!-- Inputs -->
<form class="flex flex-col space-y-3" onsubmit="event.preventDefault()">
<!-- Full Name -->
<div class="relative w-full h-[54px] bg-white border border-[#DADADA] rounded-[16px] px-4 flex items-center">
<span class="material-symbols-outlined text-[20px] text-[#6B6B6B] mr-3">badge</span>
<input class="w-full bg-transparent font-inter text-[14px] text-[#0A0A0A] placeholder-[#6B6B6B] focus:outline-none border-none p-0 focus:ring-0" placeholder="Full Name" type="text">
</div>
<!-- Email Address -->
<div class="relative w-full h-[54px] bg-white border border-[#DADADA] rounded-[16px] px-4 flex items-center">
<span class="material-symbols-outlined text-[20px] text-[#6B6B6B] mr-3">mail</span>
<input class="w-full bg-transparent font-inter text-[14px] text-[#0A0A0A] placeholder-[#6B6B6B] focus:outline-none border-none p-0 focus:ring-0" placeholder="Email address" type="email">
</div>
<!-- Password -->
<div class="relative w-full h-[54px] bg-white border border-[#DADADA] rounded-[16px] px-4 flex items-center">
<span class="material-symbols-outlined text-[20px] text-[#6B6B6B] mr-3">lock</span>
<input class="w-full bg-transparent font-inter text-[14px] text-[#0A0A0A] placeholder-[#6B6B6B] focus:outline-none border-none p-0 pr-2 focus:ring-0" id="passwordInput" placeholder="Password" type="password">
<button aria-label="Toggle password visibility" class="text-[#6B6B6B] flex items-center active:opacity-70 focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility_off</span>
</button>
</div>
<!-- Checkbox Row -->
<div class="pt-0.5 pb-1 flex items-center">
<label class="flex items-center space-x-2.5 cursor-pointer select-none">
<input checked="" class="sr-only" id="termsCheck" type="checkbox">
<div class="w-5 h-5 rounded-[6px] bg-[#0A0A0A] flex items-center justify-center transition-all flex-shrink-0" id="checkVisual">
<span class="material-symbols-outlined text-white text-[14px]">check</span>
</div>
<span class="font-inter text-[13px] text-[#6B6B6B]">I agree to Terms</span>
</label>
</div>
<!-- Register Primary Button -->
<button class="w-full h-[52px] bg-[#0A0A0A] rounded-full text-white font-inter font-semibold text-[14px] flex items-center justify-center relative active:opacity-90 transition-opacity" type="submit">
<span class="">Register</span>
<span class="absolute right-2.5 w-7 h-7 rounded-full bg-white flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-[#0A0A0A]">arrow_forward</span>
</span>
</button>
<!-- Divider -->
<div class="relative flex items-center justify-center my-1.5 py-1">
<div class="w-full h-[1px] bg-[#DADADA]"></div>
<span class="absolute px-3 bg-white font-inter text-[12px] text-[#6B6B6B] leading-none">or</span>
</div>
<!-- Continue with Google Button -->
<button class="w-full h-[50px] bg-transparent border border-[#DADADA] rounded-full text-[#0A0A0A] font-inter font-semibold text-[14px] flex items-center justify-center space-x-2.5 active:opacity-80 transition-opacity" type="button">
<svg class="w-[18px] h-[18px]" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#0A0A0A"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#0A0A0A"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#0A0A0A"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#0A0A0A"></path>
</svg>
<span class="">Continue with Google</span>
</button>
</form>
</main>
<!-- FOOTER -->
<footer class="w-full text-center mb-3 flex-shrink-0">
<p class="font-inter text-[14px] text-[#6B6B6B] m-0">
      Have an account? <a class="font-semibold text-[#0A0A0A] underline underline-offset-4 active:opacity-75" href="#">Login</a>
</p>
</footer>
<script>
    // Password visibility toggle
    const togglePassBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if (togglePassBtn && passwordInput && eyeIcon) {
      togglePassBtn.addEventListener('click', () => {
        const isPass = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPass ? 'text' : 'password');
        eyeIcon.textContent = isPass ? 'visibility' : 'visibility_off';
      });
    }

    // Terms checkbox interactive toggle
    const termsCheck = document.getElementById('termsCheck');
    const checkVisual = document.getElementById('checkVisual');

    if (termsCheck && checkVisual) {
      termsCheck.addEventListener('change', () => {
        if (termsCheck.checked) {
          checkVisual.className = 'w-5 h-5 rounded-[6px] bg-[#0A0A0A] flex items-center justify-center transition-all flex-shrink-0';
          checkVisual.innerHTML = '<span class="material-symbols-outlined text-white text-[14px]">check</span>';
        } else {
          checkVisual.className = 'w-5 h-5 rounded-[6px] bg-[#EAEAEA] border border-[#DADADA] flex items-center justify-center transition-all flex-shrink-0';
          checkVisual.innerHTML = '';
        }
      });
    }
  </script>




</body></html>
