<!DOCTYPE html><html class="h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Kanavu Illam - Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Syne:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0A0A0A",
            "secondary-text": "#6B6B6B",
            "soft-fill": "#EAEAEA",
            "border-line": "#DADADA",
            "page-bg": "#F4F4F4"
          },
          fontFamily: {
            syne: ["Syne", "sans-serif"],
            inter: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      max-width: 390px;
      max-height: 844px;
      margin: 0 auto;
      padding: 0;
      overflow: hidden;
      background-color: #F4F4F4;
      position: relative;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#F4F4F4] text-[#0A0A0A] font-inter antialiased flex flex-col justify-between h-full w-full px-5 py-8 select-none overflow-hidden">
<!-- Top Brand Emblem Section -->
<header class="flex flex-col items-center justify-center pt-2"><div class="w-[56px] h-[56px] flex items-center justify-center"><svg class="w-[56px] h-[56px] text-[#0A0A0A]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9.5z"></path><path d="M9 21V12h6v9"></path><text x="12" y="18.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="Syne" font-size="6.5" font-weight="600" letter-spacing="-0.5">KI</text></svg></div><h2 class="font-syne font-medium text-[24px] text-[#0A0A0A] tracking-tight mt-2">Kanavu Illam</h2></header>
<!-- Main Elevated White Card -->
<main class="w-full bg-[#FFFFFF] rounded-[28px] p-6 shadow-[0_8px_24px_rgba(10,10,10,0.06)] flex flex-col my-auto">
<!-- Title and Subtitle -->
<div class="mb-5">
<h1 class="font-syne font-medium text-[24px] leading-tight text-[#0A0A0A] tracking-tight mb-1">Welcome back</h1>

</div>
<!-- Login Form -->
<form class="flex flex-col" onsubmit="event.preventDefault();">
<!-- Input Group (16px gap) -->
<div class="flex flex-col gap-4">
<!-- Email or Phone -->
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#6B6B6B] text-[20px] pointer-events-none">mail</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-white border border-[#DADADA] rounded-[16px] text-[#0A0A0A] placeholder-[#6B6B6B] font-inter text-[15px] focus:outline-none focus:border-[#0A0A0A] transition-colors" placeholder="Email or Phone" type="text">
</div>
<!-- Password -->
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[#6B6B6B] text-[20px] pointer-events-none">lock</span>
<input class="w-full h-[56px] pl-12 pr-12 bg-white border border-[#DADADA] rounded-[16px] text-[#0A0A0A] placeholder-[#6B6B6B] font-inter text-[15px] focus:outline-none focus:border-[#0A0A0A] transition-colors" id="passwordInput" placeholder="Password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3.5 p-1 text-[#6B6B6B] hover:text-[#0A0A0A] transition-colors flex items-center justify-center cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end mt-2 mb-4">
<a class="font-inter text-[13px] text-[#6B6B6B] hover:text-[#0A0A0A] transition-colors" href="#forgot">
          Forgot Password?
        </a>
</div>
<!-- Sign In Primary Button -->
<button class="w-full h-[52px] rounded-full bg-[#0A0A0A] text-white font-inter font-semibold text-[14px] flex items-center justify-center relative active:opacity-90 transition-opacity shadow-[0_4px_16px_rgba(0,0,0,0.12)] cursor-pointer" type="submit">
<span class="">Sign in</span>
<div class="absolute right-4 w-6 h-6 rounded-full bg-white flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-[#0A0A0A] font-bold">arrow_forward</span>
</div>
</button>
<!-- Thin Divider with "or" -->
<div class="relative flex items-center justify-center my-4">
<div class="w-full h-[1px] bg-[#DADADA]"></div>
<span class="absolute px-3 bg-white font-inter text-[12px] text-[#6B6B6B]">or</span>
</div>
<!-- Continue with Google Outline Button -->
<button class="w-full h-[52px] rounded-full bg-transparent border border-[#DADADA] text-[#0A0A0A] font-inter font-semibold text-[14px] flex items-center justify-center gap-3 active:bg-black/5 transition-colors cursor-pointer" type="button">
<!-- Monochrome Google 'G' icon -->
<svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
<path d="M21.35 11.1h-9.17v2.98h5.27c-.23 1.25-.94 2.31-1.99 3.01v2.5h3.22c1.88-1.73 2.97-4.28 2.97-7.29 0-.41-.03-.81-.1-1.2h-.2z" fill="#0A0A0A"></path>
<path d="M12.18 22c2.7 0 4.96-.9 6.61-2.41l-3.22-2.5c-.89.6-2.03.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.25v2.58C4.89 19.76 8.28 22 12.18 22z" fill="#0A0A0A"></path>
<path d="M6.58 13.93c-.2-.6-.31-1.25-.31-1.93s.11-1.33.31-1.93V7.49H3.25C2.58 8.83 2.2 10.37 2.2 12s.38 3.17 1.05 4.51l3.33-2.58z" fill="#0A0A0A"></path>
<path d="M12.18 5.95c1.47 0 2.79.51 3.83 1.5l2.87-2.87C17.14 3.04 14.88 2 12.18 2 8.28 2 4.89 4.24 3.25 7.49l3.33 2.58c.79-2.36 3-4.12 5.6-4.12z" fill="#0A0A0A"></path>
</svg>
<span class="">Continue with Google</span>
</button>
</form>
</main>
<!-- Footer (Exactly ONE line) -->
<footer class="pb-2 text-center">
<p class="font-inter text-[14px] text-[#6B6B6B]">
      New here? <a class="font-bold text-[#0A0A0A] underline ml-1 cursor-pointer" href="#signup">Sign up</a>
</p>
</footer>
<script>
    (function() {
      const toggleBtn = document.getElementById('togglePassword');
      const pwdInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (toggleBtn && pwdInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = pwdInput.type === 'password';
          pwdInput.type = isPassword ? 'text' : 'password';
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>




</body></html>
